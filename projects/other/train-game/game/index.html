<!doctype html>
<html lang="en">
<head>

<title>Train Game Prototype</title>
<style>

</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
const H = 10, W = H * 16 / 9;
const TSHAPE = { w: 988, h: 126, roof: 36, fx: 106, fy: 22, last: 0.93 };
const scrX = sx => cfg.mirror ? W - sx : sx;
const shapePt = (px, py) => ({ x: scrX((cfg.trainX + px / TSHAPE.w * cfg.trainW) * W), y: H * (1 - cfg.trainTop) - py / TSHAPE.h * cfg.trainH * H });

const BIOMES = [{ key: 'landscape' }, { key: 'building' }, { key: 'hills' }];

const cfg = {
  planeSpeed: 9, hearts: 10, hurtTime: 1.5, hitbox: 0.18, scroll: 1.5, hazardSpeed: 1,
  archGap: 2.4, archSpeed: 3.4, bulletSpeed: 5.5, fireRate: 1,
  trainX: 0, trainTop: 0.828, trainW: 1, trainH: 0.172, mirror: true, infiniteHealth: false,
  shiftX: 0.02, zoom: 0.92, tilt: -1, keystone: 2,
};

const floorY = () => OP.feet;
const opX = () => shapePt(TSHAPE.w * TSHAPE.last, 0).x;
const lo = () => floorY() + 0.55;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
let rngState = 1;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let S = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;

  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.style.transform = `translateX(${-cfg.shiftX * w}px) rotate(${cfg.tilt}deg) perspective(${w * 1.5}px) rotateY(${-cfg.keystone}deg)`;

  cv.height = Math.round(h * dpr);

addEventListener('resize', resize);
resize();

const KEYS = { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'] };

let padPrev = new Set(), padDirsPrev = new Set();

    if (ax > PAD.dead || b(15)) padDirs.add('right');
    if (ay < -PAD.dead || b(12)) padDirs.add('up');
    if (ay > PAD.dead || b(13)) padDirs.add('down');

    if (dirHit('down')) movePause(1);
    if (PAUSE.sel === PAUSE.train && dirHit('left')) setTrainVol(Math.max(0, TRAIN_VOL.level - 1));
    if (PAUSE.sel === PAUSE.train && dirHit('right')) setTrainVol(Math.min(TRAIN_VOL.steps, TRAIN_VOL.level + 1));

    if (hit(1)) closePause();

}
const PAUSE = { open: false, sel: 0, train: 3 };
const TRAIN_VOL = { steps: 10, level: 3 };
const setTrainVol = l => { TRAIN_VOL.level = (l + TRAIN_VOL.steps + 1) % (TRAIN_VOL.steps + 1); sfx.train.volume = TRAIN_VOL.level / TRAIN_VOL.steps; };
const pauseItems = () => ['RESUME', 'START OVER', soundOn ? 'SOUND ON' : 'SOUND OFF', 'TRAIN', 'STAGE 1', 'STAGE 2', 'STAGE 3'];

const sfx = {};
for (const [k, f] of Object.entries({ train: 'train', hit: 'hit', harpies: 'harpies', fireballs: 'dragon-fireballs', laser: 'dragon-laser', win: 'win', lose: 'lose' })) { sfx[k] = new Audio(`sfx/${f}.mp3?v=2`); sfx[k].preload = 'auto'; }
sfx.train.loop = true; sfx.train.volume = TRAIN_VOL.level / TRAIN_VOL.steps;
let soundOn = true, laserSound = null;
const lastSound = {};
function play(name, vol = 1, gap = 0) {

  lastSound[name] = now;
  const a = sfx[name].cloneNode();

addEventListener('pointerdown', startTrainSound);
addEventListener('keydown', e => {

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
addEventListener('dblclick', toggleFullscreen);
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());

let shake = 0, hudMode = false;
const world = () => {

function box(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x - w / 2, y - h / 2, w, h); }

const art = {};
const ART = { 'lvl1': 'webp', 'lvl1dark': 'webp', 'lvl2-back': 'png', 'lvl2-mid': 'webp', 'lvl2-front': 'webp', 'lvl2-chandelier': 'png', 'lvl2-props': 'png', 'lvl2-floor': 'png', 'lvl2-balloon-a': 'webp', 'lvl2-balloon-b': 'webp', 'lvl2-balloon-c': 'webp', 'en1-sun': 'png', 'beam-1': 'png', 'beam-2': 'png', 'beam-3': 'png', 'beam-4': 'png', 'beam-5': 'png', 'beam-6': 'png', 'en1-wing': 'png', 'en1-hand': 'png', 'en1-shoot-1': 'png', 'en1-shoot-2': 'png', 'en1-shoot-3': 'png', 'en1-shoot-4': 'png', 'en1-fly': 'png', 'girl-head': 'png', 'win-panel': 'png', 'girl-1': 'png', 'girl-2': 'png', 'girl-3': 'png', 'girl-4': 'png', 'girl-5': 'png', 'girl-6': 'png', 'cloud-transition': 'webp', 'lvl3-cloud-strip': 'webp', 'lvl3-map': 'webp', 'vine-transition': 'webp', 'fg-plant': 'webp', 'column': 'png', 'chandelier': 'png', 'zep-1': 'png', 'zep-2': 'png', 'zep-3': 'png', 'zep-4': 'png', 'chain': 'png' };
for (const [name, ext] of Object.entries(ART)) {
  art[name] = new Image();
  art[name].src = `art/${name}.${ext}?v=202611071653`;
}
const ready = img => img.complete && img.naturalWidth > 0;
function drawImg(img, x, y, sx, sy, ox, oy, rot = 0) {
  if (!ready(img)) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy); ctx.drawImage(img, -ox, -oy); ctx.restore();
}

let scroll = 0;
function bgStrip(img, speed) {
  if (!ready(img)) return;
  const s = H / img.naturalHeight, w = img.naturalWidth * s, off = (scroll * speed) % w;
  for (let x = -off; x < W; x += w) drawImg(img, x, H, s, -s, 0, 0);
}
const MENU = { hold: 10, dim: 'rgba(12,10,14,0.55)' };
const dim = c => box(W / 2, H / 2, W, H, c);
function bgLandscape() { box(W / 2, H / 2, W, H, '#2f5a5c'); bgStrip(isMenu() ? art.lvl1dark : art.lvl1, 1); if (isMenu()) drawWindows(() => bgStrip(art.lvl1, 1)); }
const BG_VIDEO = { size: 640 / 108, y: H * (1 - 410 / 1080), gap: 272, pitch: 553 };
const bgVideoEl = Object.assign(document.createElement('video'), { src: 'art/lvl2-video.mp4', muted: true, loop: true, playsInline: true, preload: 'auto' });
let bgVideo = null;
function startBgVideo() {
  const k = H / 1080, P = BG_VIDEO.pitch * k, c0 = BG_VIDEO.gap * k, u = scroll + W + BG_VIDEO.size / 2;
  bgVideo = { u: c0 + Math.ceil((u - c0) / P) * P };

}
function updateBgVideo(dt) {
  if (!bgVideo) return;
  const cx = bgVideo.u - scroll;
  if (cx + BG_VIDEO.size / 2 < -1) { bgVideo = null; bgVideoEl.pause(); }
}
function drawBgVideo() {
  if (!bgVideo || isMenu() || bgVideoEl.readyState < 2) return;
  const z = BG_VIDEO.size, s = z / bgVideoEl.videoWidth, x = bgVideo.u - scroll - z / 2, top = BG_VIDEO.y + z / 2;
  ctx.save();

  else { ctx.translate(x, top); ctx.scale(s, -s); }

  ctx.drawImage(bgVideoEl, 0, 0);
  ctx.filter = 'none';
  ctx.fillStyle = 'rgba(70,40,95,0.4)';
  ctx.fillRect(0, 0, bgVideoEl.videoWidth, bgVideoEl.videoHeight);

}
const BALLOON = { vx: 0.6, vy: 0.9, seq: ['b', 'c', 'a', 'b', 'a', 'c', 'b', 'a', 'c'], spots: [9, 2.5, 13, 6, 15, 1, 10.5, 4, 12], src: { 'lvl2-balloon-a': [842, 1434], 'lvl2-balloon-b': [508, 1172], 'lvl2-balloon-c': [879, 1592] }, pace: { 'lvl2-balloon-b': 1, 'lvl2-balloon-a': 0.85, 'lvl2-balloon-c': 0.7 },
  gaps: [3, 3.4, 2.8, 3.2] };
let balloons = [], balloonT = 0, balloonN = 0, balloonsSeeded = false;
function makeBalloon(img, sx, y) {
  const u = H / 1080, [pw, ph] = BALLOON.src[img];
  return { img, k: 1, w: pw * u, h: ph * u, sx, y };
}
function seedBalloons() {
  balloonsSeeded = true;
  balloons = [makeBalloon('lvl2-balloon-a', 0.5, 9), makeBalloon('lvl2-balloon-b', 6.5, 7.5), makeBalloon('lvl2-balloon-c', 11.5, 10.5)];
  balloonT = 1;
  balloonN = 0;
}
function spawnBalloonGroup() {
  const n = balloonN++, c = BALLOON.seq[n % BALLOON.seq.length];
  const b = makeBalloon('lvl2-balloon-' + c, BALLOON.spots[n % BALLOON.spots.length], 2.9);
  balloons.push(b);
  return BALLOON.gaps[n % BALLOON.gaps.length];
}
const WIN_PANEL = { drift: 22, dx: 150, at: 0.6, slide: 1.2 };
function drawWinPanel() {
  const img = art['win-panel'];
  if (!(state === 'over' && won) || !ready(img)) return;
  const t = overT - WIN_PANEL.at;
  if (t < 0) return;
  const k = Math.min(1, t / WIN_PANEL.slide), e = 1 - (1 - k) * (1 - k) * (1 - k);
  const w = img.naturalWidth, h = img.naturalHeight;
  const [gx, gy] = girlPt(GIRL.head[0] + GIRL.neck[0] - 30, GIRL.head[1] + GIRL.neck[1] - 50);
  const ex = gx + WIN_PANEL.dx - t * WIN_PANEL.drift, x = ex - w, y = Math.min(gy - h / 2, 1080 - h - 10);

const WIN_FLY = { vx: 1.1, vy: 1.7, planeVx: 0.8, planeVy: 1.2, hold: 6.5, fade: 1.2 };
let winBalloons = false;
function updateBalloons(dt) {
  if (isMenu()) { balloons = []; balloonsSeeded = false; winBalloons = false; return; }
  if (state === 'over' && won) {
    if (!winBalloons) {

      balloons = [makeBalloon('lvl2-balloon-b', 1, 4.5), makeBalloon('lvl2-balloon-c', 6, 7), makeBalloon('lvl2-balloon-a', 11.5, 5.5)];
      for (const b of balloons) b.fade = 0;
    }
    for (const b of balloons) { const k = BALLOON.pace[b.img]; b.sx -= WIN_FLY.vx * k * dt; b.y += WIN_FLY.vy * k * dt; b.fade = Math.min(1, b.fade + dt / WIN_FLY.fade); }

function hallBack() { box(W / 2, H / 2, W, H, '#013c5b'); bgStrip(art['lvl2-back'], 0); drawBalloons(); bgStrip(art['lvl2-mid'], 0.6); bgStrip(art['lvl2-props'], 0.6); bgStrip(art['lvl2-chandelier'], 0.8); }

const SKY = { color: '#809e6d', cloudSpeed: 0.8, dim: 'rgba(30,34,30,0.5)' };

const plane = { x: 6, y: 6, vx: 0, vy: 0, tilt: 0, hp: 3, hurt: 0, gone: false };

const DRAGON_GAP = 2.6;
function updatePlane(dt, time) {

const ZEP = { bx: 65, by: 58, cx: 79, cy: 55, ax: 82, ay: 106, w: 1.5, src: 158, frames: 4, fps: 8 };

  A: ['.#.', '#.#', '###', '#.#', '#.#'], B: ['##.', '#.#', '##.', '#.#', '##.'], C: ['.##', '#..', '#..', '#..', '.##'],
  I: ['###', '.#.', '.#.', '.#.', '###'], K: ['#.#', '#.#', '##.', '#.#', '#.#'], L: ['#..', '#..', '#..', '#..', '###'],
  N: ['#..#', '##.#', '#.##', '#..#', '#..#'], O: ['.#.', '#.#', '#.#', '#.#', '.#.'], R: ['##.', '#.#', '##.', '#.#', '#.#'],
  S: ['.##', '#..', '.#.', '..#', '##.'], T: ['###', '.#.', '.#.', '.#.', '.#.'], U: ['#.#', '#.#', '#.#', '#.#', '###'],
  Y: ['#.#', '#.#', '.#.', '.#.', '.#.'], V: ['#.#', '#.#', '#.#', '#.#', '.#.'], D: ['##.', '#.#', '#.#', '#.#', '##.'],
  E: ['###', '#..', '##.', '#..', '###'], F: ['###', '#..', '##.', '#..', '#..'],
  M: ['#...#', '##.##', '#.#.#', '#...#', '#...#'],
  H: ['#.#', '#.#', '###', '#.#', '#.#'], P: ['##.', '#.#', '##.', '#..', '#..'], G: ['.##', '#..', '#.#', '#.#', '.##'],
};
const HINT = { time: 4, flick: 0.15, flicks: 3 };
function drawPause() {
  const s = 1920 / 68, dot = 1.04, pts = [], items = pauseItems();
  ctx.save();
  ctx.setTransform(cv.width / 1920, 0, 0, cv.height / 1080, 0, 0);
  ctx.fillStyle = 'rgba(8,8,12,0.62)'; ctx.fillRect(0, 0, 1920, 1080);
  ctx.fillStyle = 'rgba(8,8,12,0.55)'; ctx.fillRect(18.5 * s, 4.5 * s, 31 * s, 30 * s);
  const text = (str, y, c, x0 = Math.round((136 - dotTextWidth(str, 1)) / 2)) => {
    let x = x0;
    for (const ch of str) { const g = DOT_FONT[ch]; if (!g) continue; g.forEach((row, j) => [...row].forEach((v, i) => { if (v === '#') pts.push([x + i, y + j, c]); })); x += g[0].length + 1; }
    return x0;
  };
  const vol = [], VP = 2.6;
  text('PAUSED', 12, '#ffffff');
  items.forEach((it, i) => {
    const y = 23 + i * 6, c = i === PAUSE.sel ? '#ffffff' : '#8d8f94';
    let x0;
    if (i === PAUSE.train) {
      const lw = dotTextWidth(it, 1);
      x0 = text(it, y, c, Math.round((136 - lw - 3 - (TRAIN_VOL.steps - 1) * VP - 2) / 2));
      for (let k = 0; k < TRAIN_VOL.steps; k++) vol.push([x0 + lw + 4 + k * VP, y + 2, k < TRAIN_VOL.level]);
    } else x0 = text(it, y, c);
    if (i === PAUSE.sel) for (const [dx, dy] of [[-4, 2], [-3, 1], [-3, 3], [-2, 2]]) pts.push([x0 + dx, y + dy, LED.color]);
  });
  const big = [], r = s * dot / 2, pad = s * dot / 4 * (OUTLINE_DOT.size - 1);
  for (let x = 18; x <= 49; x++) big.push([x, 4], [x, 34]);
  for (let y = 5; y <= 33; y++) big.push([18, y], [49, y]);
  ctx.fillStyle = OUTLINE_DOT.color;
  for (const [x, y] of big) { ctx.beginPath(); ctx.arc((x + 0.5) * s, (y + 0.5) * s, r + pad, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  for (const [x, y] of big) { ctx.beginPath(); ctx.arc((x + 0.5) * s, (y + 0.5) * s, r, 0, Math.PI * 2); ctx.fill(); }
  drawFineDots(pts, s, dot);
  for (const [fill, rr, hole] of [[OUTLINE_DOT.color, r + pad, r * 0.45 - pad], ['#e8344a', r, r * 0.45]]) {
    ctx.fillStyle = fill;
    for (const [fx, fy, on] of vol) {
      const x = (fx + 0.5) * s / 2, y = (fy + 0.5) * s / 2;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2);
      if (!on) ctx.arc(x, y, Math.max(0, hole), 0, Math.PI * 2, true);
      ctx.fill('evenodd');
    }
  }
  ctx.restore();
}
function hintBlinkOff() {
  if (state !== 'play' || BIOMES[bi].key !== 'landscape' || runT > HINT.time) return false;
  const end = HINT.time - HINT.flick * HINT.flicks * 2;
  return runT > end && Math.floor((runT - end) / HINT.flick) % 2 === 0;
}
function drawControlsHint() {
  if (!controlsDots || PAUSE.open || state !== 'play' || BIOMES[bi].key !== 'landscape' || runT > HINT.time || hintBlinkOff()) return;
  const s = 1920 / controlsDots.cols;
  ctx.save();
  ctx.setTransform(cv.width / 1920, 0, 0, cv.height / 1080, 0, 0);
  drawFineDots(controlsPts, s, controlsDots.dot);
  ctx.restore();
}
const dotTextWidth = (str, pitch) => [...str].reduce((w, ch) => w + ((DOT_FONT[ch]?.[0].length ?? 0) + 1) * pitch, -pitch);
function dotText(str, x, y, pitch, color, r = 0.52) {
  ctx.fillStyle = color;
  for (const ch of str) {
    const g = DOT_FONT[ch];
    if (!g) continue;
    g.forEach((row, j) => [...row].forEach((c, i) => {
      if (c !== '#') return;
      ctx.beginPath(); ctx.arc(x + (i + 0.5) * pitch, y - (j + 0.5) * pitch, pitch * r, 0, Math.PI * 2); ctx.fill();
    }));
    x += (g[0].length + 1) * pitch;
  }
}
function drawHud() {
  if (isMenu()) drawTitleDots(1);
  hudMode = true;
  world();
  if (!isMenu() && !hintOn()) {
    const cell = W / (titleDots?.cols || 68), dd = cell * (titleDots?.dot || 1.04);
    ctx.fillStyle = OUTLINE_DOT.color;
    for (let i = 0; i < cfg.hearts; i++) {
      const x = 0.4 + i * cell * 1.3, y = H - 0.4, pad = dd / 4 * (OUTLINE_DOT.size - 1);
      ctx.beginPath(); ctx.arc(x, y, dd / 2 + pad, 0, Math.PI * 2);
      if (i >= plane.hp) ctx.arc(x, y, Math.max(0, dd / 2 * 0.45 - pad), 0, Math.PI * 2, true);
      ctx.fill('evenodd');
    }
    ctx.fillStyle = '#e8344a';
    for (let i = 0; i < cfg.hearts; i++) {
      const x = 0.4 + i * cell * 1.3, y = H - 0.4;
      ctx.beginPath(); ctx.arc(x, y, dd / 2, 0, Math.PI * 2);
      if (i >= plane.hp) ctx.arc(x, y, dd / 2 * 0.45, 0, Math.PI * 2, true);
      ctx.fill('evenodd');
    }
    dotText(`${meters()} m`, 0.28, H - 0.68, cell * 0.45, OUTLINE_DOT.color, 0.52 * OUTLINE_DOT.size);
    dotText(`${meters()} m`, 0.28, H - 0.68, cell * 0.45, '#ffffff');
  }
  hudMode = false;
  world();
  drawControlsHint();
}

let last = performance.now(), time = 0;
function frame(now) {
  pollPads();
  const dt = PAUSE.open ? 0 : clamp((now - last) / 1000, 0, 0.05);
  last = now; time += dt;
  scroll += cfg.scroll * dt;
  shake = Math.max(0, shake - dt);
  updateGame(dt);
  updatePlane(dt, time);
  updateDragon(dt);
  updateHazards(dt);

  world();
  if (vineOnScreen()) vineSplit();
  else BG[BIOMES[bi].key](time, drawBackFog);
  for (const h of hazards) if (h.kind === 'gnat') HZ.gnat.draw(h);
  for (const h of hazards) if (h.kind === 'arch') HZ.arch.draw(h);
  drawDragon();
  for (const h of hazards) if (h.kind !== 'arch' && h.kind !== 'gnat') HZ[h.kind].draw(h);
  if (!isMenu()) {
    drawWinPanel();
    const hand = drawOperator(time);
    if (!(state === 'over' && won)) drawTether(hand, time);
    drawPlane(time);
  }
  if ((vine || fgDecos.length) && !isMenu()) { fgDecos.forEach(d => drawFg(art[d.img], d.x)); drawVine(); }
  drawFrontFog();
  drawHud();
  if (PAUSE.open) drawPause();
  requestAnimationFrame(frame);
}

toTitle();
requestAnimationFrame(frame);
</script>
