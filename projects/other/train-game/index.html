<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>train game - karmirarev</title>
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light')document.documentElement.dataset.theme='dark'})()</script>
  <link rel="stylesheet" href="/site.css?v=87">
  <style>
    body {
      padding: 14px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .side {
      display: none !important;
    }
    .train-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      align-self: flex-start;
      padding: 8px 14px;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--lilac);
      background: var(--paper);
    }
    .train-head .page-title {
      margin: 0;
    }
    .train-head .hint {
      font-size: 12px;
    }
    .train-head .theme-toggle {
      margin-left: 4px;
    }
    .home {
      font-size: 13px;
      padding: 1px 10px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
      color: var(--ink);
      text-decoration: none;
    }
    .home:hover {
      background: var(--lime);
      text-decoration: none;
    }
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
    }
    .screen {
      width: min(100cqw - 6px, (100cqh - 6px) * 16 / 9);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--lilac);
      background: #140f0c;
      overflow: hidden;
    }
    .screen iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

<div class="train-head" id="head">
  <a class="home" href="/projects/#other">back</a>
  <p class="page-title">train game</p>
  <span class="hint">a prototype. arrows or wasd to fly, m for sound, f for full screen.</span>
</div>
<div class="stage">
  <div class="screen">
    <iframe id="game" src="./game/" title="train game" allow="fullscreen"></iframe>
  </div>
</div>

<div class="menu" id="menu"></div>

<script>
  const game = document.getElementById('game');
  game.addEventListener('load', () => game.contentWindow.focus());
  document.addEventListener('DOMContentLoaded', () => {
    const t = document.querySelector('.theme-toggle');
    if (t) document.getElementById('head').appendChild(t);
  });
</script>
<script src="/nav.js?v=78"></script>
</body>
</html>
