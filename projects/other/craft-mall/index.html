<html>
<head>

  <style>
    body {
      padding: 14px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .side {
      display: none !important;
    }

      position: relative;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--lilac);
      background: var(--paper);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .mall.hot {
      cursor: pointer;
    }
    .mall.dragging {
      cursor: grabbing;
    }
    .mall-world,
    .mall-layer {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }
    .mall-layer canvas {
      position: absolute;
      left: 0;
      top: 0;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .mall-glow {
      pointer-events: none;
    }
    .mall-world .mall-guy {
      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      pointer-events: none;

    .post,

      position: absolute;
      left: 0;
      top: 0;
    }
    .post {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-bottom: 20px;
      pointer-events: none;
    }
    .post::after {
      content: '';
      position: absolute;
      z-index: -1;
      left: calc(50% - 1px);
      top: 6px;
      bottom: 0;
      width: 2px;
      background: var(--maroon);
    }
    .board {
      --fill: var(--paper);
      position: relative;
      pointer-events: auto;
      white-space: nowrap;
      font: inherit;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.35;
      padding: 2px 17px 2px 9px;
      border: 0;
      background: var(--maroon);
      color: var(--maroon);
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);
    }
    .board::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 1px;
      background: var(--fill);
      clip-path: polygon(0 0, calc(100% - 8.5px) 0, 100% 50%, calc(100% - 8.5px) 100%, 0 100%);
    }
    .board.l {
      padding: 2px 9px 2px 17px;
      clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
    }
    .board.l::before {
      clip-path: polygon(8.5px 0, 100% 0, 100% 100%, 8.5px 100%, 0 50%);
    }
    .board.small {
      --fill: var(--lilac);
      font-size: 10px;
      font-weight: normal;
      padding: 0 13px 0 6px;
      color: var(--ink);

    .board:hover,
    .board.hover {
      --fill: var(--lime);
    }
    .board.on {
      --fill: var(--green);
      color: #1b1b1b;
    }
    .note .board {
      cursor: default;
      pointer-events: none;
    }
    .mall.far .tag,
    .mall.far .note {
      display: none;
    }
    .panel {
      position: absolute;
      z-index: 2;
      box-sizing: border-box;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--lilac);
      background: var(--paper);
      cursor: default;

    .mall-head {
      top: 12px;
      left: 12px;

      display: flex;
      align-items: center;

    .card-head .page-title {
      margin: 0;

      height: 15px;
      padding: 0;
      font: inherit;
      font-size: 13px;

      margin: 0 0 4px;

    @media (max-width: 700px) {

      }

      }

<script>
  const FLOORS = [

      ] },
    { key: 'vinyl-record-store', name: 'vinyl record store', x: 62, y: 85, z: 152, w: 10, d: 10, h: 40, walls: 'xy', wall: 'peachW', point: 'l',
      about: 'music to put on.',

        { key: 'soundtracks', name: 'soundtracks', x: 5, y: 0, w: 5, d: 10, fl: ['grid', 'tan'] }
      ] },
    { key: 'closet', name: 'closet', x: 80, y: 70, z: 144, w: 14, d: 8, h: 40, walls: 'xy', wall: 'lilacW2', point: 'r',
      about: 'things to wear.',
      sections: [
        { key: 'fashion', name: 'fashion', x: 0, y: 0, w: 8, d: 8, fl: ['grid', 'lilacF'] },
        { key: 'jewelry', name: 'jewelry', x: 8, y: 0, w: 6, d: 8, fl: ['plain', 'wine2'] }
      ] },
    { key: 'conversation-pit', name: 'conversation pit', x: 62, y: 70, z: 208, w: 10, d: 8, h: 0, walls: '', point: 'l', open: true,
      about: 'a sunken couch on the roof, for the ideas people bring.',
      sections: [
        { key: 'free-format', name: 'free format', x: 0, y: 0, w: 10, d: 5, fl: ['grid', 'roof'] },
        { key: 'topics', name: 'topics', x: 0, y: 5, w: 5, d: 3, fl: ['grid', 'roof'] },
        { key: 'suggestions', name: 'suggestions', x: 5, y: 5, w: 5, d: 3, fl: ['grid', 'roof'] }
      ] },
    { key: 'archive', name: 'archive', x: 96, y: 96, z: -230, w: 28, d: 18, h: 52, walls: 'xy', wall: 'bwall', under: true, point: 'r',
      about: 'the basement. when the week resets, every piece comes down here and gets a shelf for its week.',
      sections: [
        { key: 'past-weeks', name: 'past weeks', x: 0, y: 0, w: 28, d: 18, fl: ['grid', 'bfloor'] }
      ] }
  ];
  const STAIRS = [
    ['ground', 'gallery', 'x', 9], ['ground', 'cinema', 'y', 15], ['gallery', 'museum', 'x', 3], ['gallery', 'library', 'y', 4],
    ['cinema', 'library', 'x', 4], ['cinema', 'arcade', 'y', 19], ['museum', 'vinyl-record-store', 'y', 4], ['library', 'vinyl-record-store', 'x', 3],
    ['library', 'closet', 'y', 11], ['arcade', 'closet', 'x', 3], ['vinyl-record-store', 'conversation-pit', 'y', 3], ['closet', 'conversation-pit', 'x', 2]
  ];
  const ARCHIVE_ROWS = [1.2, 4.4, 7.6, 10.8, 14], ARCHIVE_COLS = [1, 6.2, 11.4, 16.6, 21.8];

  const byKey = {}, SECTIONS = [null];
  FLOORS.forEach(f => {
    byKey[f.key] = f;
    f.gapX = null;
    f.gapY = null;
    f.sections.forEach(s => {
      s.floor = f;
      s.id = SECTIONS.length;
      SECTIONS.push(s);
    });
  });
  STAIRS.forEach(([a, , dir, s]) => { byKey[a][dir === 'x' ? 'gapX' : 'gapY'] = [s, s + 3]; });

  const SLAB = 10, ZMAX = 5;
  const proj = (x, y, z) => [(x - y) * 8, (x + y) * 4 - z];
  const bounds = [Infinity, Infinity, -Infinity, -Infinity];
  FLOORS.forEach(f => [f.x, f.x + f.w + 6].forEach(x => [f.y, f.y + f.d].forEach(y => [f.z - SLAB - 30, f.z + f.h + 60].forEach(z => {
    const [sx, sy] = proj(x, y, z);
    bounds[0] = Math.min(bounds[0], sx); bounds[1] = Math.min(bounds[1], sy);
    bounds[2] = Math.max(bounds[2], sx); bounds[3] = Math.max(bounds[3], sy);
  }))));
  const OX = 40 - bounds[0], OY = 40 - bounds[1];
  const W = Math.ceil(bounds[2] - bounds[0] + 80), H = Math.ceil(bounds[3] - bounds[1] + 80);

  const view = document.getElementById('mall'), world = document.getElementById('world'), layer = document.getElementById('layer');
  const scene = document.getElementById('scene'), glow = document.getElementById('glow');
  const card = document.getElementById('card'), tools = document.getElementById('tools'), guy = document.getElementById('guy');
  scene.width = glow.width = W;
  scene.height = glow.height = H;
  const sctx = scene.getContext('2d'), gctx = glow.getContext('2d');
  const img = sctx.createImageData(W, H), gimg = gctx.createImageData(W, H);
  const buf = new Uint32Array(img.data.buffer), gbuf = new Uint32Array(gimg.data.buffer);
  const ids = new Uint8Array(W * H);

  const probe = document.createElement('canvas').getContext('2d');
  function rgb(v) {
    probe.fillStyle = '#000';
    probe.fillStyle = v.trim();
    return [1, 3, 5].map(i => parseInt(probe.fillStyle.slice(i, i + 2), 16));
  }
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const sh = (c, f) => c.map(v => Math.min(255, Math.round(v * f)));
  const pack = c => (0xff000000 | c[2] << 16 | c[1] << 8 | c[0]) >>> 0;

  let C;
  function palette() {
    const st = getComputedStyle(document.documentElement), v = n => rgb(st.getPropertyValue(n));
    const P = v('--paper'), I = v('--ink'), M = v('--maroon'), G = v('--green'), L = v('--lime'), V = v('--lilac'), O = v('--orange');
    const Wt = [242, 240, 232];
    C = {
      P, I, M, G, L, V, O,
      line: M,
      part: mix(V, P, 0.3),
      cap: mix(P, Wt, 0.3),
      wood: mix(O, P, 0.4),
      dark: mix(M, P, 0.25),
      light: mix(P, Wt, 0.55),
      paperS: mix(P, Wt, 0.7),
      glass: mix(V, Wt, 0.45),
      seat: mix(M, O, 0.35),
      cushion: mix(O, P, 0.15),
      step: mix(L, Wt, 0.25),
      slab: mix(M, P, 0.4),
      cell: mix(P, L, 0.5),
      map: mix(V, P, 0.4),
      mat: mix(M, P, 0.45),
      cream: mix(P, Wt, 0.35),
      stone: mix(P, L, 0.6),
      stone2: mix(P, M, 0.14),
      olive: mix(G, P, 0.55),
      olive2: mix(G, P, 0.72),
      wine: mix(M, P, 0.6),
      wine2: mix(M, P, 0.7),
      lilacF: mix(V, P, 0.55),
      lilac2: mix(V, P, 0.5),
      lilacD: V,
      peach: mix(O, P, 0.6),
      peach2: mix(O, P, 0.78),
      tan: mix(O, P, 0.72),
      roof: mix(P, L, 0.35),
      bfloor: mix(P, M, 0.14),
      wineW: mix(M, P, 0.55),
      lilacW: mix(V, P, 0.45),
      lilacW2: mix(V, P, 0.25),
      oliveW: mix(G, P, 0.5),
      peachW: mix(O, P, 0.5),
      arcW: mix(V, M, 0.2),
      bwall: mix(V, M, 0.25)
    };
  }

  let room = 0, clip = null, things = [];
  const at = (x, y, z) => [OX + (x - y) * 8, OY + (x + y) * 4 - z];

  function span(poly, yc) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      if ((y1 <= yc && y2 > yc) || (y2 <= yc && y1 > yc)) {
        const x = x1 + (yc - y1) / (y2 - y1) * (x2 - x1);
        if (x < lo) lo = x;
        if (x > hi) hi = x;
      }
    }
    return [lo, hi];
  }

  function fill(pts, c) {
    const col = pack(c);
    let y0 = Infinity, y1 = -Infinity;
    pts.forEach(p => { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    for (let y = Math.max(0, Math.floor(y0)); y < Math.min(H, Math.ceil(y1)); y++) {
      let [lo, hi] = span(pts, y + 0.5);
      if (clip) {
        const [a, b] = span(clip, y + 0.5);
        lo = Math.max(lo, a);
        hi = Math.min(hi, b);
      }
      const a = Math.max(0, Math.ceil(lo - 0.5)), b = Math.min(W, Math.ceil(hi - 0.5));
      for (let x = a; x < b; x++) {
        buf[y * W + x] = col;
        if (room >= 0) ids[y * W + x] = room;
      }
    }
  }

  function dot(x, y, col) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    if (clip) {
      const [a, b] = span(clip, y + 0.5);
      if (!(x + 0.5 >= a && x + 0.5 < b)) return;
    }
    buf[y * W + x] = col;
    if (room >= 0) ids[y * W + x] = room;
  }

  function line(p, q, c) {
    const col = pack(c);
    let x0 = Math.round(p[0]), y0 = Math.round(p[1]);
    const x1 = Math.round(q[0]), y1 = Math.round(q[1]);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      dot(x0, y0, col);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  const outline = (q, c) => q.forEach((p, i) => line(p, q[(i + 1) % q.length], c));
  function quad(ps, c, e) {
    const q = ps.map(p => at(...p));
    fill(q, c);
    if (e) outline(q, e);
  }
  const flat = (x, y, z, w, d, c, e) => quad([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], c, e);
  const faceX = (x, y, z, d, h, c, e) => quad([[x, y, z], [x, y + d, z], [x, y + d, z + h], [x, y, z + h]], c, e);
  const faceY = (x, y, z, w, h, c, e) => quad([[x, y, z], [x + w, y, z], [x + w, y, z + h], [x, y, z + h]], c, e);
  function box(x, y, z, w, d, h, c, e = C.line) {
    faceX(x + w, y, z, d, h, sh(c, 0.86), e);
    faceY(x, y + d, z, w, h, sh(c, 0.72), e);
    flat(x, y, z + h, w, d, c, e);
  }

  function put(key, fn) {
    const r = room;
    things.push({ key, fn: () => { room = r; fn(); } });
  }
  const B = (x, y, z, w, d, h, c, e) => put(x + w / 2 + y + d / 2, () => box(x, y, z, w, d, h, c, e));
  function flush() {
    things.sort((a, b) => a.key - b.key).forEach(t => t.fn());
    things = [];
  }

  function pattern(x, y, z, w, d, [kind, a, b]) {
    const ca = C[a], cb = C[b];
    flat(x, y, z, w, d, ca);
    if (kind === 'grid') {
      const g = sh(ca, 0.92);
      for (let k = 2; k < d; k += 2) line(at(x, y + k, z), at(x + w, y + k, z), g);
      for (let k = 2; k < w; k += 2) line(at(x + k, y, z), at(x + k, y + d, z), g);
    }
    if (kind === 'check' || kind === 'check2') {
      const n = kind === 'check' ? 1 : 2;
      for (let i = 0; i < w / n; i++) for (let j = 0; j < d / n; j++) if ((i + j) % 2) flat(x + i * n, y + j * n, z, n, n, cb);
    }
  }

  function hole(x, y, z, w, d, depth, f, wc, inside) {
    clip = [at(x, y, z), at(x + w, y, z), at(x + w, y + d, z), at(x, y + d, z)];
    flat(x, y, z - depth, w, d, f);
    faceX(x, y, z - depth, d, depth, sh(wc, 0.86), C.line);
    faceY(x, y, z - depth, w, depth, sh(wc, 0.72), C.line);
    inside();
    const rim = clip;
    clip = null;
    outline(rim, C.line);
  }

  const secAt = (f, rx, ry) => f.sections.find(s => rx >= s.x && rx < s.x + s.w && ry >= s.y && ry < s.y + s.d) || f.sections[0];
  const inGap = (gap, t) => gap && t + 1 > gap[0] && t < gap[1];
  function use(f, key) { room = f.sections.find(s => s.key === key).id; }

  function edges(f) {
    const c = C[f.wall], { x: X, y: Y, z: Z, h } = f;
    const runs = (len, gap, idAt) => {
      const out = [];
      for (let t = 0; t < len; t++) {
        if (inGap(gap, t)) continue;
        const id = idAt(t), last = out[out.length - 1];
        if (last && last[1] === t && last[2] === id) last[1] = t + 1;
        else out.push([t, t + 1, id]);
      }
      return out;
    };
    if (f.walls.includes('x')) {
      runs(f.d, f.gapX, t => secAt(f, 0, t).id).forEach(([a, b, id]) => {
        room = id;
        faceX(X, Y + a, Z, b - a, h, sh(c, 0.86), C.line);
        faceX(X, Y + a, Z, b - a, 3, sh(c, 0.7), C.line);
        flat(X - 0.3, Y + a, Z + h, 0.3, b - a, C.cap, C.line);
        faceY(X - 0.3, Y + b, Z, 0.3, h, sh(C.cap, 0.72), C.line);
      });
    } else {
      for (let t = 0; t < f.d; t++) if (!inGap(f.gapX, t)) { room = secAt(f, 0, t).id; B(X - 0.25, Y + t, Z, 0.25, 1, 8, C.part); }
    }
    if (f.walls.includes('y')) {
      runs(f.w, f.gapY, t => secAt(f, t, 0).id).forEach(([a, b, id]) => {
        room = id;
        faceY(X + a, Y, Z, b - a, h, sh(c, 0.72), C.line);
        faceY(X + a, Y, Z, b - a, 3, sh(c, 0.6), C.line);
        flat(X + a, Y - 0.3, Z + h, b - a, 0.3, C.cap, C.line);
        faceX(X + b, Y - 0.3, Z, 0.3, h, sh(C.cap, 0.86), C.line);
      });
    } else {
      for (let t = 0; t < f.w; t++) if (!inGap(f.gapY, t)) { room = secAt(f, t, 0).id; B(X + t, Y - 0.25, Z, 1, 0.25, 8, C.part); }
    }
    if (f.walls.includes('x') && f.walls.includes('y')) {
      room = secAt(f, 0, 0).id;
      flat(X - 0.3, Y - 0.3, Z + h, 0.3, 0.3, C.cap, C.line);
    }
  }

  function doorway(a, b, fn) {
    if (b - a < 1) return;

  function drawFloor(f) {
    const { x: X, y: Y, z: Z } = f, deco = DECOR[f.key];
    f.sections.forEach(s => { room = s.id; pattern(X + s.x, Y + s.y, Z, s.w, s.d, s.fl); });
    slab(f);
    if (deco.under) deco.under(f, X, Y, Z);
    edges(f);
    if (deco.back) deco.back(f, X, Y, Z);
    partitions(f);
    if (deco.stuff) deco.stuff(f, X, Y, Z);
    flush();
    if (deco.front) deco.front(f, X, Y, Z);
  }

  function drawStair([a, b, dir, s]) {
    const A = byKey[a], n = (byKey[b].z - A.z) / 8;
    room = 0;
    for (let i = n - 1; i >= 0; i--) {
      const z = A.z + 8 * (i + 1) - 12;
      if (dir === 'x') box(A.x - i - 1, A.y + s, z, 1, 3, 12, C.step);
      else box(A.x + s, A.y - i - 1, z, 3, 1, 12, C.step);
    }
  }

  function dash(p, q) {
    const col = pack(C.O), x = Math.round(p[0]), y0 = Math.round(p[1]);
    for (let y = y0; y <= q[1]; y++) if ((y - y0) % 6 < 3) dot(x, y, col);
  }

  function draw() {
    palette();
    buf.fill(0);
    ids.fill(0);
    const units = FLOORS.map(f => ({ key: f.x + f.w / 2 + f.y + f.d / 2 + f.z / 4, fn: () => drawFloor(f) }))
      .concat(STAIRS.map(st => {
        const A = byKey[st[0]], n = (byKey[st[1]].z - A.z) / 8;
        const cx = st[2] === 'x' ? A.x - n / 2 : A.x + st[3] + 1.5, cy = st[2] === 'x' ? A.y + st[3] + 1.5 : A.y - n / 2;
        return { key: cx + cy + (A.z + 4 * n) / 4, fn: () => drawStair(st) };
      }));
    units.sort((a, b) => a.key - b.key).forEach(u => u.fn());
    room = -1;
    const G = byKey.ground, A = byKey.archive;
    dash(at(G.x, G.y + G.d, -SLAB), at(A.x, A.x - (G.x - G.y - G.d), A.z + A.h));
    dash(at(G.x + G.w, G.y, -SLAB), at(A.y + G.x + G.w - G.y, A.y, A.z + A.h));
    dash(at(G.y + G.d + 5.75, G.y + G.d, -SLAB), at(A.y + 13.85 + 5.75, A.y + 13.85, A.z + 26));
    sctx.putImageData(img, 0, 0);
  }

    if (!t) return null;
    return new Set(t.sections ? t.sections.map(s => s.id) : [t.id]);

    gbuf.fill(0);
    const col = pack(C.G);
    [idsOf(sel), idsOf(hover)].forEach(set => {

      }

  const GRAPH = {};
  function link(a, b, pts) {
    (GRAPH[a] = GRAPH[a] || []).push({ to: b, pts });
    (GRAPH[b] = GRAPH[b] || []).push({ to: a, pts: pts.slice().reverse() });
  }

      link(a, b, [[A.x + 0.6, y, A.z], [A.x, y, A.z], [A.x - n, y, Bf.z], [A.x - n - 0.6, y, Bf.z]]);
    } else {
      const x = A.x + s + 1.5;
      link(a, b, [[x, A.y + 0.6, A.z], [x, A.y, A.z], [x, A.y - n, Bf.z], [x, A.y - n - 0.6, Bf.z]]);
    }
  });
  (() => {

    link('ground', 'archive', [[G.x + 17, G.y + 8.9, G.z], [G.x + 17, G.y + 9.5, G.z - 4], [G.x + 17, G.y + 12.6, G.z - 24],

  function route(from, to) {
    const prev = { [from]: null }, q = [from];
    while (q.length) {
      const k = q.shift();
      if (k === to) break;
      (GRAPH[k] || []).forEach(e => { if (!(e.to in prev)) { prev[e.to] = { k, e }; q.push(e.to); } });
    }
    const steps = [];
    for (let k = to; prev[k]; k = prev[k].k) steps.unshift(prev[k].e);
    return steps;
  }
  const spotFor = t => {
    const f = t.sections ? t : t.floor;
    return t.sections ? [f.x + f.w / 2, f.y + f.d / 2, f.z] : [f.x + t.x + t.w / 2, f.y + t.y + t.d / 2, f.z];
  };
  const lobbyStart = [byKey.ground.x + 14, byKey.ground.y + 8.5, 0];
  const walker = { p: lobbyStart.slice(), floor: 'ground', queue: [], flip: false };
  function walkTo(t) {
    let keep = [], base = walker.floor;
    const end = walker.queue.findIndex(q => q.floor);
    if (end >= 0) {
      keep = walker.queue.slice(0, end + 1);
      base = keep[end].floor;
    }
    const f = t.sections ? t : t.floor, pts = [];
    route(base, f.key).forEach(e => e.pts.forEach((p, i) => pts.push({ p: p.slice(0, 3), jump: p[3] === 'jump', floor: i === e.pts.length - 1 ? e.to : null })));
    pts.push({ p: spotFor(t), jump: false, floor: null });
    walker.queue = keep.concat(pts);
    run();
  }

  let s = 1, cx = W / 2, cy = H / 2, cam = null, raf = 0, last = 0;
  const fitScale = () => Math.min(view.clientWidth / W, view.clientHeight / H) * 0.92;
  const clampS = v => Math.max(Math.min(1, fitScale()), Math.min(ZMAX, v));
  function place() {
    const vw = view.clientWidth, vh = view.clientHeight;
    cx = Math.max(0, Math.min(W, cx));
    cy = Math.max(0, Math.min(H, cy));
    const tx = Math.round(vw / 2 - cx * s), ty = Math.round(vh / 2 - cy * s);
    world.style.transform = `translate(${tx}px, ${ty}px)`;
    layer.style.transform = `scale(${s})`;
    view.classList.toggle('far', s < 1.7);
    labels.forEach(el => { el.style.transform = `translate(${Math.round(el.spot[0] * s)}px, ${Math.round(el.spot[1] * s)}px) translate(-50%, -100%)`; });
    const [gx, gy] = at(...walker.p);
    guy.style.height = 24 * s + 'px';
    guy.style.transform = `translate(${Math.round(gx * s)}px, ${Math.round(gy * s)}px) translate(-50%, -100%)${walker.flip ? ' scaleX(-1)' : ''}`;
  }
  function zoomAt(ns, ax, ay) {
    const vw = view.clientWidth, vh = view.clientHeight;
    const wx = cx + (ax - vw / 2) / s, wy = cy + (ay - vh / 2) / s;
    s = clampS(ns);
    cx = wx - (ax - vw / 2) / s;
    cy = wy - (ay - vh / 2) / s;
  }
  function zoomTo(ts, ax, ay) {
    cam = { mode: 'zoom', s: clampS(ts), ax, ay };
    run();
  }
  function flyTo([x, y], ts) {
    cam = { mode: 'fly', s: clampS(ts), x, y };
    run();
  }
  function run() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const k = 1 - Math.pow(0.0015, dt);
    if (cam) {
      if (cam.mode === 'zoom') {
        const ns = Math.abs(cam.s - s) < 0.003 ? cam.s : s + (cam.s - s) * k;
        zoomAt(ns, cam.ax, cam.ay);
        if (ns === cam.s) cam = null;
      } else {
        s += (cam.s - s) * k;
        cx += (cam.x - cx) * k;
        cy += (cam.y - cy) * k;
        if (Math.abs(cam.s - s) < 0.003 && Math.hypot(cam.x - cx, cam.y - cy) < 0.5) {
          s = cam.s;
          cx = cam.x;
          cy = cam.y;
          cam = null;
        }
      }
    }
    let moving = walker.queue.length > 0;
    if (moving) {
      let left = dt * 7;
      while (left > 0 && walker.queue.length) {
        const q = walker.queue[0], p = walker.p;
        if (q.jump) {
          walker.p = q.p.slice();
        } else {
          const dx = q.p[0] - p[0], dy = q.p[1] - p[1], dz = (q.p[2] - p[2]) / 8, dist = Math.hypot(dx, dy, dz);
          if (dist > left) {
            const r = left / dist;
            walker.p = [p[0] + dx * r, p[1] + dy * r, p[2] + dz * 8 * r];
            const sx = (dx - dy) * 8;
            if (Math.abs(sx) > 0.01) walker.flip = sx < 0;
            break;
          }
          left -= dist;
          walker.p = q.p.slice();
        }
        if (q.floor) walker.floor = q.floor;
        walker.queue.shift();
      }
      moving = walker.queue.length > 0;
    }
    place();
    if (cam || moving) run();
  }

  function hit(e) {
    const r = scene.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / s), y = Math.floor((e.clientY - r.top) / s);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    return SECTIONS[ids[y * W + x]] || null;
  }
  const top1 = t => t && t.floor && t.floor.sections.length === 1 ? t.floor : t;
  const keyOf = t => !t ? '' : t.sections ? t.key : t.floor.sections.length === 1 ? t.floor.key : t.floor.key + '/' + t.key;
  function setHover(t) {
    view.classList.toggle('hot', !!t);
    if (t === hover) return;
    hover = t;
    const k = keyOf(t);
    boards.forEach(b => b.classList.toggle('hover', !!k && b.dataset.pick === k));
    drawGlow();
  }

  function cardFor(t) {
    const head = title => `<div class="card-head"><p class="page-title">${title}</p><button type="button" class="card-min" aria-label="fold">${card.classList.contains('min') ? '+' : '-'}</button></div>`;
    if (!t) return head('craft mall') + `<div class="card-body">
      <p>a virtual mall for artists. every floor is one theme, and every week new works fill it. when the week resets, they move down to the archive in the basement.</p>
      <p class="card-title">floors</p>
      <ul class="floor-list">${FLOORS.map(f => `<li><button type="button" data-pick="${f.key}">${f.name}</button></li>`).join('')}</ul></div>`;
    const f = t.sections ? t : t.floor;
    const tags = f.sections.length > 1 ? `<p class="card-title">${f.key === 'ground' ? 'rooms' : 'sections'}</p><div class="tags">${f.sections.map(s => `<button type="button" class="${s === t ? 'on' : ''}" data-pick="${f.key}/${s.key}">${s.name}</button>`).join('')}</div>`
      : f.tags ? `<p class="card-title">tags</p><div class="tags">${f.tags.map(x => `<span>${x}</span>`).join('')}</div>` : '';
    const facts = f.under ? '<dt>shelved</dt><dd>no weeks yet</dd>' : '<dt>this week</dt><dd>empty</dd><dt>after the reset</dt><dd>goes down to the archive</dd>';
    return head(t.name) + `<div class="card-body">
      ${t.sections ? '' : `<p class="sub">on the ${f.name}${f.key === 'ground' ? '' : ' floor'}</p>`}
      <p>${t.about || f.about}</p>${tags}<dl class="facts">${facts}</dl>
      <button type="button" class="back" data-pick="${t.sections ? '' : f.key}">${t.sections ? 'all floors' : 'back to ' + f.name}</button></div>`;
  }
  function lookup(k) {
    const [a, b] = k.split('/'), f = byKey[a];
    if (!f) return null;
    return b ? f.sections.find(x => x.key === b) || f : f;
  }
  function apply(center) {
    const t = lookup(decodeURIComponent(location.hash.slice(1)));
    if (t && t !== sel) walkTo(t);
    sel = t;
    const k = keyOf(sel);
    boards.forEach(b => b.classList.toggle('on', !!k && b.dataset.pick === k));
    card.innerHTML = cardFor(sel);
    drawGlow();
    if (center && sel) {
      const [x, y] = at(...spotFor(sel));
      flyTo([x, y - 20], Math.max(cam && cam.s || s, 2));
    }
  }
  let recenter = false;
  function pick(k, center) {
    recenter = !!center;
    if (!k) {
      history.pushState(null, '', location.pathname);
      apply(false);
    } else if (location.hash !== '#' + k) location.hash = k;
    else apply(recenter);
  }

  const overlay = e => e.target.closest('button, a, .panel');
  const pointers = new Map();
  let drag = null, pinch = null;
  const mid = () => {
    const [a, b] = [...pointers.values()];
    return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y)];
  };
  const local = e => {
    const r = view.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  view.addEventListener('pointerdown', e => {
    if (e.button !== 0 || overlay(e)) return;
    view.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, local(e));
    cam = null;
    if (pointers.size === 2) {
      const [mx, my, d] = mid();
      pinch = { s, d, wx: cx + (mx - view.clientWidth / 2) / s, wy: cy + (my - view.clientHeight / 2) / s };
      drag = null;
      view.classList.remove('dragging');
    } else if (pointers.size === 1) {
      drag = { x: e.clientX, y: e.clientY, cx, cy, moved: false };
    }
  });
  view.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, local(e));
    if (pinch && pointers.size === 2) {
      const [mx, my, d] = mid();
      s = clampS(pinch.s * d / pinch.d);
      cx = pinch.wx - (mx - view.clientWidth / 2) / s;
      cy = pinch.wy - (my - view.clientHeight / 2) / s;
      place();
      return;
    }
    if (!drag) return setHover(overlay(e) ? null : top1(hit(e)));
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      view.classList.add('dragging');
      setHover(null);
    }
    if (drag.moved) {
      cx = drag.cx - dx / s;
      cy = drag.cy - dy / s;
      place();
    }
  });
  function release(e) {
    pointers.delete(e.pointerId);
    if (pinch) {
      if (pointers.size < 2) pinch = null;
      drag = null;
      return;
    }
    if (!drag) return;
    if (!drag.moved && e.type === 'pointerup') {
      const t = top1(hit(e));
      if (t) pick(keyOf(t));
    }
    drag = null;
    view.classList.remove('dragging');
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  view.addEventListener('pointerleave', () => { if (!drag) setHover(null); });
  view.addEventListener('wheel', e => {
    if (overlay(e)) return;
    e.preventDefault();
    const p = local(e);
    const mouse = e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
    if (e.ctrlKey) {
      cam = null;
      zoomAt(s * Math.exp(-e.deltaY * 0.01), p.x, p.y);
      place();
    } else if (mouse) {
      const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
      const from = cam && cam.mode === 'zoom' ? cam.s : s;
      zoomTo(from * Math.exp(-dy * 0.0022), p.x, p.y);
    } else {
      cam = null;
      cx += e.deltaX / s;
      cy += e.deltaY / s;
      place();
    }
  }, { passive: false });
  window.addEventListener('pointerdown', e => {
    if (view.contains(e.target) && !overlay(e)) view.classList.toggle('hot', !!hit(e));
  }, true);
  view.addEventListener('click', e => {
    const b = e.target.closest('[data-pick], .zb, .card-min');
    if (!b) return;
    if (b.classList.contains('card-min')) {
      card.classList.toggle('min');
      b.textContent = card.classList.contains('min') ? '+' : '-';
    } else if (b.classList.contains('zb')) {
      const from = cam && cam.mode === 'zoom' ? cam.s : s;
      zoomTo(from * (b.dataset.zoom === '1' ? 1.5 : 1 / 1.5), view.clientWidth / 2, view.clientHeight / 2);
    } else pick(b.dataset.pick, !!b.closest('.mall-card'));
  });
  window.addEventListener('hashchange', () => {
    apply(recenter);
    recenter = false;
  });
  window.addEventListener('resize', () => { s = clampS(s); place(); });
  document.addEventListener('DOMContentLoaded', () => {
    const t = document.querySelector('.theme-toggle');
    if (t) tools.appendChild(t);
  });
  new MutationObserver(() => { draw(); drawGlow(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (innerWidth < 700) card.classList.add('min');
  draw();
  [cx, cy] = at(byKey.library.x + 7, byKey.library.y + 12, byKey.library.z - 40);
  place();
  apply(!!location.hash);
</script>
