<html>
<head>

    body {
      padding: 14px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .side {
      display: none !important;
    }
    .mall {
      position: relative;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--lilac);
      background: var(--paper);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .mall.hot {
      cursor: pointer;
    }
    .mall.dragging {
      cursor: grabbing;
    }
    .mall-world,
    .mall-layer {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }
    .mall-layer canvas {
      position: absolute;
      left: 0;
      top: 0;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .mall-glow {
      pointer-events: none;
    }
    .mall-world .mall-guy {
      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      pointer-events: none;
    }
    .post,
    .tag,
    .note {
      position: absolute;
      left: 0;
      top: 0;
    }
    .post {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-bottom: 20px;
      pointer-events: none;
    }
    .post::after {
      content: '';
      position: absolute;
      z-index: -1;
      left: calc(50% - 1px);
      top: 6px;
      bottom: 0;
      width: 2px;
      background: var(--maroon);
    }
    .board {
      --fill: var(--paper);
      display: inline-block;
      position: relative;
      pointer-events: auto;
      white-space: nowrap;
      font: inherit;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.35;
      padding: 2px 17px 2px 9px;
      border: 0;
      background: var(--maroon);
      color: var(--maroon);
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);
    }
    .board::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 1px;
      background: var(--fill);
      clip-path: polygon(0 0, calc(100% - 8.5px) 0, 100% 50%, calc(100% - 8.5px) 100%, 0 100%);
    }
    .board.l {
      padding: 2px 9px 2px 17px;
      clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
    }
    .board.l::before {
      clip-path: polygon(8.5px 0, 100% 0, 100% 100%, 8.5px 100%, 0 50%);
    }
    .board.small {
      --fill: var(--lilac);
      font-size: 10px;
      font-weight: normal;
      padding: 0 13px 0 6px;
      color: var(--ink);
    }
    .board:hover,
    .board.hover {
      --fill: var(--lime);
    }
    .board.on {
      --fill: var(--green);
      color: #1b1b1b;
    }
    .note .board {
      cursor: default;
      pointer-events: none;
    }
    .mall.far .tag,
    .mall.far .note,
    .mall.room .tag,
    .mall.iso .tag,
    .mall.iso .note,
    .mall.room .note:not(.here),
    .mall.iso .post:not(.here),
    .mall.room .post:not(.here),

      display: none;
    }
    .mall.room .tip.on {
      display: block;
    }
    .tip .board {
      pointer-events: none;
      cursor: default;
    }
    .edges {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .board.edge {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 13px;
    }
    .map-btn {
      font: inherit;
      font-size: 13px;
      background: none;
      cursor: pointer;
    }
    .piece-view {
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      max-height: calc(100% - 40px);
      overflow: auto;
      padding: 14px 18px 18px;
    }

    .panel {

      -webkit-user-select: text;
    }

      justify-content: space-between;
      margin-top: 12px;
      color: var(--maroon);
      font-weight: bold;
    }

      width: 22px;
      height: 22px;
      padding: 0;
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: var(--paper);
      color: var(--maroon);
      cursor: pointer;
    }
    .cal-step:hover {
      background: var(--maroon);
      color: var(--paper);
    }

      gap: 4px;
      margin-top: 10px;
    }
    .cal-grid .dow {

      text-align: center;
      color: var(--maroon);
    }
    .day {

      aspect-ratio: 1;
      padding: 0;
      font: inherit;
      font-size: 12px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;

    .day.on {

      color: #1b1b1b;
    }
    .day.has::after {
      content: '';
      position: absolute;
      left: calc(50% - 3px);
      bottom: 3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
    }

      padding: 10px 0;
      border-bottom: 1px dashed var(--orange);
    }
    .card-body .ev-title {
      color: var(--maroon);
      font-weight: bold;
    }
    .card-body .ev-meta {

      font-size: 12px;
    }

      margin-top: 8px;
      font-size: 12px;
    }
    .ev-row .pill {
      padding: 0 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      background: var(--lilac);
    }
    .ev-x {
      font: inherit;
      font-size: 12px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--maroon);
      text-decoration: underline;
      cursor: pointer;
    }

      display: grid;
      gap: 9px;
      margin-top: 12px;
    }
    .cal-form label {
      display: grid;
      gap: 3px;
      font-size: 12px;
      color: var(--maroon);
    }
    .cal-form label.inline {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--ink);
    }
    .cal-form input:not([type="radio"]),

      width: 100%;
      font: inherit;
      font-size: 13px;
      padding: 4px 6px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      background: var(--paper);
      color: var(--ink);

      gap: 8px;

      align-items: center;

      background: var(--lilac);
      color: var(--maroon);
      font-size: 12px;

      display: flex;
      align-items: center;

      margin: 0;
    }

      width: 15px;
      height: 15px;
      padding: 0;
      font: inherit;
      font-size: 13px;
      line-height: 13px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: transparent;
      color: var(--maroon);

    .card-min:hover {

    .floor-list li {
      display: flex;
      align-items: center;
      margin: 0 0 4px;
      break-inside: avoid;
    }

      content: '';
      flex: none;
      box-sizing: border-box;
      width: 11px;
      height: 11px;
      margin-right: 6px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
    }
    .floor-list button,
    .back {
      font: inherit;
      font-size: 13px;
      text-align: left;
      padding: 1px 5px;
      border: 0;
      border-radius: 3px;
      background: none;
      color: var(--ink);
      cursor: pointer;
    }
    .floor-list button:hover,
    .back:hover {
      background: var(--lime);
    }
    .back {
      margin-top: 14px;
      padding: 1px 10px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
    }
    .tags button,
    .tags span {
      font: inherit;
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      background: var(--lilac);
      color: var(--ink);
      cursor: pointer;
    }
    .tags button:hover {
      background: var(--lime);
    }
    .tags button.on {
      background: var(--green);
      color: #1b1b1b;
    }
    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px dashed var(--orange);
      font-size: 14px;
      line-height: 1.5;
    }
    .facts dt {
      color: var(--maroon);
      font-size: 12px;
      line-height: 1.8;
    }
    .facts dd {
      margin: 0;
    }
    @media (max-width: 700px) {
      body {
        padding: 10px;
      }
      .mall-head .hint,
      .mall-head .page-title {
        display: none;
      }
      .mall-card {
        max-height: 45%;
      }
    }
  </style>
</head>
<body>

<div class="mall" id="mall">
  <div class="mall-world" id="world">
    <div class="mall-layer" id="layer">
      <canvas class="mall-scene" id="scene"></canvas>

    </div>
    <img class="mall-guy" id="guy" src="/guy.gif" alt="">
  </div>
  <div class="panel mall-head">
    <a class="home" href="/projects/#other">back</a>

    <p class="page-title">craft mall</p>
    <span class="hint">a mockup. drag to move, scroll or pinch to zoom, click a room to go in.</span>
  </div>
  <div class="panel mall-tools" id="tools">
    <button type="button" class="zb" data-zoom="1" aria-label="zoom in">+</button>
    <button type="button" class="zb" data-zoom="-1" aria-label="zoom out">-</button>
  </div>
  <div class="edges" id="edges" hidden></div>
  <div class="panel mall-card" id="card"></div>

</div>

          cx = cam.x;
          cy = cam.y;
          stopCam();
        }
      }
    }
    let moving = walker.queue.length > 0;
    if (moving) {
      let left = dt * 7;
      while (left > 0 && walker.queue.length) {
        const q = walker.queue[0], p = walker.p;
        if (q.jump) {
          walker.p = q.p.slice();
        } else {
          const dx = q.p[0] - p[0], dy = q.p[1] - p[1], dz = (q.p[2] - p[2]) / 8, dist = Math.hypot(dx, dy, dz);
          if (dist > left) {
            const r = left / dist;
            walker.p = [p[0] + dx * r, p[1] + dy * r, p[2] + dz * 8 * r];
            const sx = (dx - dy) * 8;
            if (Math.abs(sx) > 0.01) walker.flip = sx < 0;
            break;
          }
          left -= dist;
          walker.p = q.p.slice();
        }
        if (q.floor) walker.floor = q.floor;
        walker.queue.shift();
      }
      moving = walker.queue.length > 0;
    }
    place();
    checkExit();
    if (cam || moving) run();
  }

  function hit(e) {
    const r = scene.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / s), y = Math.floor((e.clientY - r.top) / s);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    const id = ids[y * W + x];
    if (id >= 100) return mode === 'room' ? PIECE_BY_ID[id] : PIECE_BY_ID[id].section;
    return mode === 'room' ? null : SECTIONS[id] || null;
  }
  const top1 = t => t && !t.k && t.floor && t.floor.sections.length === 1 ? t.floor : t;
  const keyOf = t => !t ? '' : t.sections ? t.key : t.floor.sections.length === 1 ? t.floor.key : t.floor.key + '/' + t.key;
  function setHover(t) {
    view.classList.toggle('hot', !!t);
    if (t === hover) return;
    hover = t;
    const k = t && !t.k ? keyOf(t) : '';
    boards.forEach(b => b.classList.toggle('hover', !!k && b.dataset.pick === k));
    tip.classList.toggle('on', !!(t && t.k));
    if (t && t.k) {
      tip.w = [t.floor.x + t.at[0], t.floor.y + t.at[1], t.floor.z + t.at[2]];
      tipBoard.textContent = t.name;
      place();
    }
    drawGlow();
  }

  function cardFor(t) {
    const head = title => `<div class="card-head"><p class="page-title">${title}</p><button type="button" class="card-min" aria-label="fold">${card.classList.contains('min') ? '+' : '-'}</button></div>`;
    if (!t) return head('craft mall') + `<div class="card-body">
      <p>a virtual mall for artists. every floor is one theme, and every week new works fill it. when the week resets, they move down to the archive in the basement.</p>
      <p class="card-title">floors</p>
      <ul class="floor-list">${FLOORS.map(f => `<li><button type="button" data-pick="${f.key}">${f.name}</button></li>`).join('')}</ul></div>`;
    const f = t.sections ? t : t.floor;
    const tags = f.sections.length > 1 ? `<p class="card-title">${f.key === 'ground' ? 'rooms' : 'sections'}</p><div class="tags">${f.sections.map(s => `<button type="button" class="${s === t ? 'on' : ''}" data-pick="${f.key}/${s.key}">${s.name}</button>`).join('')}</div>`
      : f.tags ? `<p class="card-title">tags</p><div class="tags">${f.tags.map(x => `<span>${x}</span>`).join('')}</div>` : '';
    const facts = f.under ? '<dt>shelved</dt><dd>no weeks yet</dd>' : '<dt>this week</dt><dd>empty</dd><dt>after the reset</dt><dd>goes down to the archive</dd>';
    return head(t.name) + `<div class="card-body">
      ${t.sections ? '' : `<p class="sub">on the ${f.name}${f.key === 'ground' ? '' : ' floor'}</p>`}
      <p>${t.about || f.about}</p>${tags}<dl class="facts">${facts}</dl>
      <button type="button" class="back" data-pick="${t.sections ? '' : f.key}">${t.sections ? 'all floors' : 'back to ' + f.name}</button></div>`;
  }
  function lookup(k) {
    const [a, b] = k.split('/'), f = byKey[a];
    if (!f) return null;
    return b ? f.sections.find(x => x.key === b) || f : f;
  }
  function apply() {
    const t = lookup(decodeURIComponent(location.hash.slice(1)));
    if (t && t !== sel) moveBeet(t);
    sel = t;
    const k = keyOf(sel);
    boards.forEach(b => b.classList.toggle('on', !!k && b.dataset.pick === k));
    card.innerHTML = cardFor(sel);
    const f = t ? (t.sections ? t : t.floor) : null;
    if (f !== focus) {
      const prev = focus;
      focus = f;
      pieceView.hidden = true;
      buildEdges();
      labels.forEach(el => { if (el.key) el.classList.toggle('here', !!f && el.key === f.key); });
      if (!f) leave();
      else if (mode === 'room' && prev) switchRoom(f, prev);
      else enter(f);
    }
    drawGlow();
    place();
  }
  function pick(k) {
    if (!k) {
      history.pushState(null, '', location.pathname);
      apply();
    } else if (location.hash !== '#' + k) location.hash = k;
    else if (focus) {
      const v = fitIn(focus);
      if (mode === 'room') roomS = v.s;
      flyTo([v.x, v.y], v.s, mode === 'iso' ? () => cutToRoom(focus) : null);
    }
  }
  function remap(from) {
    cx = OX + (cx - from.ox) * K / from.k;
    cy = OY + (cy - from.oy) * K / from.k;
    s = s * from.k / K;
  }
  function enter(f) {
    cam = null;
    mode = 'iso';
    drawMap(f);
    const v = fitIn(f);
    flyTo([v.x, v.y], v.s, () => cutToRoom(f));
  }
  function cutToRoom(f) {
    const from = { ox: OX, oy: OY, k: K };
    mode = 'room';
    drawRoom(f);
    remap(from);
    const v = fitIn(f);
    roomS = v.s;
    drawGlow();
    flyTo([v.x, v.y], v.s);
  }
  function switchRoom(f, prev) {
    cam = null;
    drawRoom(f);
    const v = fitIn(f);
    roomS = v.s;
    s = v.s;
    const dx = f.mc[0] - prev.mc[0], dy = f.mc[1] - prev.mc[1], len = Math.hypot(dx, dy) || 1;
    const off = Math.min(view.clientWidth, view.clientHeight) * 0.45 / s;
    cx = v.x - dx / len * off;
    cy = v.y - dy / len * off;
    flyTo([v.x, v.y], v.s);
  }
  function leave() {
    cam = null;
    const from = { ox: OX, oy: OY, k: K };
    mode = 'map';
    drawMap(null);
    remap(from);
    flyTo([W / 2, H / 2], fitScale());
  }
  function redraw() {
    if (mode === 'room') drawRoom(focus);
    else drawMap(mode === 'iso' ? focus : null);
    drawGlow();
  }

  const overlay = e => e.target.closest('button, a, .panel');
  const pointers = new Map();
  let drag = null, pinch = null;
  const mid = () => {
    const [a, b] = [...pointers.values()];
    return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y)];
  };
  const local = e => {
    const r = view.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  view.addEventListener('pointerdown', e => {
    if (e.button !== 0 || overlay(e)) return;
    view.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, local(e));
    stopCam();
    if (pointers.size === 2) {
      const [mx, my, d] = mid();
      pinch = { s, d, wx: cx + (mx - view.clientWidth / 2) / s, wy: cy + (my - view.clientHeight / 2) / s };
      drag = null;
      view.classList.remove('dragging');
    } else if (pointers.size === 1) {
      drag = { x: e.clientX, y: e.clientY, cx, cy, moved: false };
    }
  });
  view.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, local(e));
    if (pinch && pointers.size === 2) {
      const [mx, my, d] = mid();
      s = clampS(pinch.s * d / pinch.d);
      cx = pinch.wx - (mx - view.clientWidth / 2) / s;
      cy = pinch.wy - (my - view.clientHeight / 2) / s;
      place();
      checkExit();
      return;
    }
    if (!drag) return setHover(overlay(e) ? null : top1(hit(e)));
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      view.classList.add('dragging');
      setHover(null);
    }
    if (drag.moved) {
      cx = drag.cx - dx / s;
      cy = drag.cy - dy / s;
      place();
    }
  });
  function release(e) {
    pointers.delete(e.pointerId);
    if (pinch) {
      if (pointers.size < 2) pinch = null;
      drag = null;
      return;
    }
    if (!drag) return;
    if (!drag.moved && e.type === 'pointerup') {
      const t = top1(hit(e));
      if (t && t.k) openPiece(t);
      else if (t) pick(keyOf(t));
    }
    drag = null;
    view.classList.remove('dragging');
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  view.addEventListener('pointerleave', () => { if (!drag) setHover(null); });
  view.addEventListener('wheel', e => {
    if (overlay(e)) return;
    e.preventDefault();
    const p = local(e);
    const mouse = e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
    if (e.ctrlKey) {
      stopCam();
      zoomAt(s * Math.exp(-e.deltaY * 0.01), p.x, p.y);
      place();
      checkExit();
    } else if (mouse) {
      const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
      const from = cam && cam.mode === 'zoom' ? cam.s : s;
      zoomTo(from * Math.exp(-dy * 0.0022), p.x, p.y);
    } else {
      stopCam();
      cx += e.deltaX / s;
      cy += e.deltaY / s;
      place();
    }
  }, { passive: false });
  window.addEventListener('pointerdown', e => {
    if (view.contains(e.target) && !overlay(e)) view.classList.toggle('hot', !!hit(e));
  }, true);
  view.addEventListener('click', e => {
    const b = e.target.closest('[data-pick], .zb, .card-min, .map-btn');
    if (!b) return;
    if (b.classList.contains('piece-close')) pieceView.hidden = true;
    else if (b.classList.contains('map-btn')) pick('');
    else if (b.classList.contains('card-min')) {
      card.classList.toggle('min');
      b.textContent = card.classList.contains('min') ? '+' : '-';
    } else if (b.classList.contains('zb')) {
      const from = cam && cam.mode === 'zoom' ? cam.s : s;
      zoomTo(from * (b.dataset.zoom === '1' ? 1.5 : 1 / 1.5), view.clientWidth / 2, view.clientHeight / 2);
    } else pick(b.dataset.pick);
  });
  window.addEventListener('hashchange', apply);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') pieceView.hidden = true; });
  window.addEventListener('resize', () => { s = clampS(s); place(); });
  document.addEventListener('DOMContentLoaded', () => {
    const t = document.querySelector('.theme-toggle');
    if (t) tools.appendChild(t);
  });
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (innerWidth < 700) card.classList.add('min');
  drawMap(null);
  [cx, cy] = at(byKey.library.x + 7, byKey.library.y + 12, byKey.library.z - 40);
  place();
  apply();
</script>
