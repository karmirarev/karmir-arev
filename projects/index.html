<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects - karmirarev</title>
  <link rel="stylesheet" href="../site.css?v=8">
  <style>
    .content {
      position: relative;
      overflow: hidden;
    }
    .deco {
      position: absolute;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .deco.dragging {
      cursor: grabbing;
      z-index: 5;
    }
    .games {
      margin-top: 16px;
    }
    .games > :first-child {
      margin-top: 0;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }
    .game {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      overflow: hidden;
      display: block;
      color: inherit;
      text-decoration: none;
    }
    a.game:hover {
      background: var(--lime);
      text-decoration: none;
    }
    .game .cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid var(--maroon);
      background: var(--paper);
    }
    .game .cover.empty {
      background-image: repeating-linear-gradient(45deg, transparent 0 10px, rgba(145, 18, 84, 0.12) 10px 12px);
    }
    .game .body {
      padding: 10px 12px 12px;
    }
    .game .name {
      color: var(--maroon);
      font-weight: bold;
      margin: 0 0 6px;
    }
    .game .tag {
      display: inline-block;
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .tag {
      background: #C1BCD7;
    }
    .game p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      padding: 16px 20px;
      margin-bottom: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .card:last-child {
      margin-bottom: 0;
    }
    .card.intro {
      border: 0;
      box-shadow: none;
      padding: 0;
    }
    .wing {
      position: relative;
    }
    .card > :first-child {
      margin-top: 0;
    }
    .card > :last-child {
      margin-bottom: 0;
    }
    .card img {
      display: block;
      width: 240px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #000;
      border: 1px solid var(--maroon);
      margin: 0 auto 16px;
    }
    .card .name {
      margin-bottom: 2px;
    }
    .card .email {
      margin-top: 2px;
    }
    .email-wrap {
      white-space: nowrap;
    }
    .copy {
      font: inherit;
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 6px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: transparent;
      color: var(--maroon);
      cursor: pointer;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy:hover {
      background: var(--lime);
    }
    .copy svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy .check {
      display: none;
    }
    .copy.done {
      border-color: var(--green);
      color: var(--green);
    }
    .copy.done .clip {
      display: none;
    }
    .copy.done .check {
      display: block;
    }
    .card p {
      line-height: 1.5;
    }
    .find a {
      display: inline-block;
      margin-right: 16px;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="wing deco-area" id="wing">
    <img class="deco" data-id="fish-1" src="./deco/fish.gif" alt="" style="left:4%;top:81%;width:71px">
    <img class="deco" data-id="fish-2" src="./deco/fish.gif" alt="" style="left:84%;top:83%;width:71px">
    <img class="deco" data-id="fish-3" src="./deco/fish.gif" alt="" style="left:52%;top:12%;width:71px">
    <img class="deco" data-id="smiley-1" src="./deco/smiley.gif" alt="" style="left:82%;top:38%;width:36px">
    <img class="deco" data-id="smiley-2" src="./deco/smiley.gif" alt="" style="left:5%;top:37%;width:36px">
    <img class="deco" data-id="smiley-3" src="./deco/smiley.gif" alt="" style="left:55%;top:61%;width:36px">
  </div>
  <div class="content" id="content">
    <p class="page-title">projects</p>
    <p>projects i am working/worked on during free time</p>
  </div>

  <div class="menu" id="menu"></div>
</div>

<script>
  const sections = {
    games: `
      <p class="page-title">games</p>
      <div class="games">
        <div class="games-grid">
          <div class="game">
            <div class="cover empty"></div>
            <div class="body">
              <p class="name">sandsong</p>
              <span class="tag mobile">mobile game</span>
              <p>a top-down mobile puzzle game about playing a flute to shape sand into pattern-paths across a field of a dangerous desert.</p>
            </div>
          </div>
          <div class="game">
            <div class="cover empty"></div>
            <div class="body">
              <p class="name">kami hovani</p>
              <span class="tag video">video game</span>
            </div>
          </div>
          <a class="game" href="./games/pingala/" target="_blank" rel="noopener">
            <div class="cover empty"></div>
            <div class="body">
              <p class="name">pingala</p>
              <span class="tag mobile">mobile game</span>
              <p>a single player code-breaking game</p>
            </div>
          </a>
          <div class="game">
            <div class="cover empty"></div>
            <div class="body">
              <p class="name">khali</p>
              <span class="tag video">video game</span>
            </div>
          </div>
        </div>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <p>some other silly things i am working/worked on</p>
    `,
  };

  const wings = {
    games: `
      <div class="card intro">
        <img src="./desk.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="email">email: <span class="email-wrap"><span id="email">maritamovsisyan@gmail.com</span><button type="button" class="copy" title="copy email" onclick="copyEmail(this)"><svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></span></p>
        <p>game designer and developer in yerevan. i work on live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./resume.pdf" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
  };

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
    document.getElementById('wing').innerHTML = wings[section] || '';
  }

  function copyEmail(btn) {
    var text = document.getElementById('email').textContent;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 1500);
    });
  }
</script>

<script src="/nav.js?v=4"></script>
<script src="/deco.js?v=4"></script>
</body>
</html>
