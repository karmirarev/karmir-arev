<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects - karmirarev</title>
  <link rel="stylesheet" href="../site.css">
  <style>
    .card {
      border: 1px solid var(--maroon);
      padding: 16px 20px;
      margin-bottom: 20px;
      width: 280px;
      max-width: 100%;
      box-sizing: content-box;
    }
    .card > :first-child {
      margin-top: 0;
    }
    .card > :last-child {
      margin-bottom: 0;
    }
    .card img {
      display: block;
      width: 200px;
      max-width: 100%;
      margin: 0 auto 16px;
    }
    .card .name {
      margin-bottom: 2px;
    }
    .card .email {
      margin-top: 2px;
    }
    .role {
      color: var(--maroon);
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-style: italic;
      font-size: 13px;
      margin-top: 0;
    }
    .card p {
      line-height: 1.5;
    }
    .find a {
      display: inline-block;
      margin-right: 16px;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="content" id="content">
    <p class="page-title">projects</p>
    <p>projects i am working/worked on during free time</p>
  </div>

  <div class="menu" id="menu"></div>
</div>

<script>
  const sections = {
    games: `
      <p class="page-title">games</p>

      <div class="card">
        <img src="./yum.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="role">game designer & developer</p>
        <p class="email">email: maritamovsisyan@gmail.com</p>
        <p>game designer and developer in yerevan. i work on a live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./resume.pdf" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <p>some other silly things i am working/worked on</p>
    `,
  };

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
  }
</script>

<script src="/nav.js"></script>
</body>
</html>
