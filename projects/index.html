<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects - karmirarev</title>
  <link rel="stylesheet" href="../site.css">
  <style>
    .content {
      position: relative;
    }
    .deco {
      position: absolute;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      .deco {
        display: none;
      }
    }
    .card {
      border: 1px solid var(--maroon);
      padding: 16px 20px;
      margin-bottom: 20px;
      width: 342px;
      max-width: 100%;
      box-sizing: border-box;
    }
    .card > :first-child {
      margin-top: 0;
    }
    .card > :last-child {
      margin-bottom: 0;
    }
    .card img {
      display: block;
      width: 240px;
      max-width: 100%;
      margin: 0 auto 16px;
    }
    .card .name {
      margin-bottom: 2px;
    }
    .card .email {
      margin-top: 2px;
    }
    .email-wrap {
      white-space: nowrap;
    }
    .copy {
      font: inherit;
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 6px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: transparent;
      color: var(--maroon);
      cursor: pointer;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy:hover {
      background: var(--lime);
    }
    .copy svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy .check {
      display: none;
    }
    .copy.done {
      border-color: var(--green);
      color: var(--green);
    }
    .copy.done .clip {
      display: none;
    }
    .copy.done .check {
      display: block;
    }
    .card p {
      line-height: 1.5;
    }
    .find a {
      display: inline-block;
      margin-right: 16px;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="content" id="content">
    <p class="page-title">projects</p>
    <p>projects i am working/worked on during free time</p>
    <img class="deco" src="./deco/sword.gif" alt="" style="left:4%;top:20%;width:62px">
    <img class="deco" src="./deco/fish.gif" alt="" style="left:34%;top:14%;width:71px">
    <img class="deco" src="./deco/glove.gif" alt="" style="left:70%;top:10%;width:64px">
    <img class="deco" src="./deco/key.gif" alt="" style="left:18%;top:40%;width:64px">
    <img class="deco" src="./deco/smiley.gif" alt="" style="left:52%;top:32%;width:36px">
    <img class="deco" src="./deco/statue.gif" alt="" style="left:80%;top:36%;width:78px">
    <img class="deco" src="./deco/toilet.gif" alt="" style="left:4%;bottom:6%;width:55px">
    <img class="deco" src="./deco/scene.gif" alt="" style="left:36%;bottom:2%;width:290px">
  </div>

  <div class="menu" id="menu"></div>
</div>

<script>
  const sections = {
    games: `
      <p class="page-title">games</p>

      <div class="card">
        <img src="./yum.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="email">email: <span class="email-wrap"><span id="email">maritamovsisyan@gmail.com</span><button type="button" class="copy" title="copy email" onclick="copyEmail(this)"><svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></span></p>
        <p>game designer and developer in yerevan. i work on live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./resume.pdf" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <p>some other silly things i am working/worked on</p>
    `,
  };

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
  }

  function copyEmail(btn) {
    var text = document.getElementById('email').textContent;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 1500);
    });
  }
</script>

<script src="/nav.js"></script>
</body>
</html>
