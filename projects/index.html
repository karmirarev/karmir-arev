<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects - karmirarev</title>
  <link rel="stylesheet" href="../gallery.css?v=6">
  <link rel="stylesheet" href="../site.css?v=30">
  <style>
    .content {
      position: relative;
      overflow: hidden;
    }
    .games {
      margin-top: 16px;
    }
    .games > :first-child {
      margin-top: 0;
    }
    .group-title {
      margin: 28px 0 12px;
      padding-top: 16px;
      border-top: 1px dashed var(--maroon);
    }
    .games > .group-title:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }
    .game {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      overflow: hidden;
      display: block;
      color: inherit;
      text-decoration: none;
    }
    a.game:hover {
      background: var(--lime);
      text-decoration: none;
    }
    .game .cover {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid var(--maroon);
      background: var(--paper);
    }
    .cover-box {
      position: relative;
      display: block;
    }
    .cover-pic {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      visibility: hidden;
    }
    a.game:hover .cover-pic {
      visibility: visible;
    }
    .game canvas.cover {
      cursor: pointer;
    }
    .game canvas.cover.no-gl {
      background-image: repeating-linear-gradient(45deg, transparent 0 10px, rgba(145, 18, 84, 0.12) 10px 12px);
    }
    .game .body {
      padding: 10px 12px 12px;
    }
    .game .name {
      color: var(--maroon);
      font-weight: bold;
      margin: 0 0 6px;
    }
    .game .tag {
      display: inline-block;
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .tag {
      background: #C1BCD7;
    }
    .game p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      padding: 16px 20px;
      margin-bottom: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .card:last-child {
      margin-bottom: 0;
    }
    .card.intro {
      border: 0;
      box-shadow: none;
      background: transparent;
      padding: 0;
    }
    .wing {
      position: relative;
    }
    .card > :first-child {
      margin-top: 0;
    }
    .card > :last-child {
      margin-bottom: 0;
    }
    .card img {
      display: block;
      width: 240px;
      max-width: 100%;
      margin: 0 auto 16px;
    }
    .card .name {
      margin-bottom: 2px;
    }
    .card .email {
      margin-top: 2px;
    }
    .email-wrap {
      white-space: nowrap;
    }
    .copy {
      font: inherit;
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 6px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: transparent;
      color: var(--maroon);
      cursor: pointer;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy:hover {
      background: var(--lime);
    }
    .copy svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy .check {
      display: none;
    }
    .copy.done {
      border-color: var(--green);
      color: var(--green);
    }
    .copy.done .clip {
      display: none;
    }
    .copy.done .check {
      display: block;
    }
    .card p {
      line-height: 1.5;
    }
    .find a {
      display: inline-block;
      margin-right: 16px;
    }
    .back {
      margin: 0 0 14px;
      font-size: 13px;
    }
    .detail-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
    }
    .detail-head .page-title {
      margin: 0;
      font-size: 22px;
    }
    .detail-head .tag {
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
    }
    .hero {
      margin: 16px 0;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      overflow: hidden;
    }
    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hero canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      cursor: pointer;
    }
    .hero canvas.no-gl {
      background-image: repeating-linear-gradient(45deg, transparent 0 10px, rgba(145, 18, 84, 0.12) 10px 12px);
    }
    .play-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-top: 16px;
    }
    .player-col {
      flex: 0 0 min(300px, 45%);
    }
    .play-text {
      flex: 1;
      min-width: 0;
    }
    .play-text > :first-child {
      margin-top: 0;
    }
    .player {
      position: relative;
      width: 100%;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: #231F20;
      overflow: hidden;
    }
    .player canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .player.loading canvas {
      visibility: hidden;
    }
    .player-bar {
      position: absolute;
      left: 20%;
      right: 20%;
      top: 50%;
      height: 10px;
      border: 1px solid var(--maroon);
      border-radius: 5px;
      background: var(--paper);
      overflow: hidden;
    }
    .player.running .player-bar {
      display: none;
    }
    .player-bar i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--green);
    }
    .player-error {
      position: absolute;
      inset: auto 16px 45%;
      margin: 0;
      color: var(--paper);
      text-align: center;
      font-size: 13px;
    }
    @media (max-width: 700px) {
      .play-row {
        flex-direction: column;
      }
      .player-col {
        flex: none;
        width: min(300px, 100%);
        margin: 0 auto;
      }
    }
    .get {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }
    .get a {
      padding: 3px 12px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
      background: var(--paper);
      text-decoration: none;
      font-size: 14px;
    }
    .get a.main {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .get a:hover {
      background: var(--lime);
      border-color: var(--maroon);
      color: #1b1b1b;
      text-decoration: none;
    }
    .block {
      margin-bottom: 24px;
    }
    .block > :first-child {
      margin-top: 0;
    }
    .block > :last-child {
      margin-bottom: 0;
    }
    .block p {
      line-height: 1.6;
    }
    .did {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .did li {
      position: relative;
      padding: 4px 0 4px 20px;
      line-height: 1.5;
    }
    .did li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.62em;
      width: 9px;
      height: 9px;
      box-sizing: border-box;
      border: 1px solid var(--maroon);
      border-radius: 2px;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .shots img {
      display: block;
      width: 100%;
      border: 1px solid var(--maroon);
      border-radius: 6px;
      cursor: pointer;
    }
    .shots img:hover {
      outline: 2px solid var(--green);
    }
    .facts {
      margin: 12px 0 24px;
    }
    .facts div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--maroon);
    }
    .facts dt {
      color: var(--maroon);
    }
    .facts dd {
      margin: 0;
      text-align: right;
    }
    .tools span {
      display: inline-block;
      margin: 0 6px 6px 0;
      padding: 2px 10px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="wing only-toy" id="wing"><canvas class="wing-toy" data-toy="wing-projects"></canvas></div>
  <div class="content" id="content">
    <p class="page-title">projects</p>
    <p>projects i am working/worked on during free time</p>
  </div>

  <div class="menu" id="menu"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">x</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const GAMES = [
    {
      key: 'sandsong',
      name: 'sandsong',
      tag: 'mobile game',
      blurb: 'a top-down mobile puzzle game about playing a flute to shape sand into pattern-paths across a field of a dangerous desert.',
      about: [],
      did: [],
      facts: { genre: 'top-down puzzle', platform: 'mobile', engine: '', status: '', year: '', role: '' },
      tools: [],
      links: { play: '', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'kami-hovani',
      name: 'kami hovani',
      tag: 'video game',
      cover: './covers/kami-hovani.webp',
      blurb: 'a 2d turn-based rpg rooted in armenian mythology, where human emotions become gods.',
      about: ['kami hovani is a 2d turn-based rpg inspired by ancient armenian mythology and folklore. you play kami, a shepherd from a village near mount nemrut, on a quest to restore balance in a world where human emotions show up as powerful gods.', 'the fights use tarot cards: every god and creature kami meets has its own card, and you lay them out in spreads that grow bigger as the game goes on. each slot in a spread carries an emotion, and matching a card to it makes the card stronger.', 'the world has four areas, hayasa, tigris, the underworld and nemrut, each with its own viewpoints, mini levels and bosses. and yes, you can pet the dog.', 'it started as my capstone project, and the design document went through three drafts.'],
      did: [],
      facts: { genre: 'turn-based rpg, card combat', platform: 'windows', engine: 'unity', status: 'prototype', year: '2025-2026', role: 'art, programming, design' },
      tools: ['clip studio paint', 'miro'],
      links: { play: '', itch: 'https://karmirarev.itch.io/kami-hovani', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'bebe-heist',
      jam: true,
      name: 'bebe heist',
      tag: 'video game',
      cover: './covers/bebe-heist.webp',
      blurb: 'a stealth game about robbing a bank run by babies while being armed with cheese.',
      about: ['the theme for global game jam 2026 was "mask".', 'we used the idea of babies not having object permanence, and the player had to sneak into a bank run by babies and freeze them by slapping a slice of cheese on their faces. from babies perspective there is no one there whenever their face is covered, hence the player can steal in peace.', 'object permanence: the cognitive understanding that people and objects still exist even when you cannot see, hear, or touch them.'],
      did: [],
      facts: { genre: 'stealth heist', platform: 'browser', engine: 'javascript', status: 'playable', year: '2026', role: 'vibecoding, art' },
      tools: ['clip studio paint'],
      links: { play: './games/bebe-heist/', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'pingala',
      name: 'pingala',
      tag: 'mobile game',
      cover: './covers/pingala.webp',
      blurb: 'a single-player code-breaking game',
      about: ['a single-player code-breaking game i used to play with my brother, turned into a playable game at his request.'],
      did: [],
      facts: { genre: 'code-breaking puzzle', platform: 'mobile, browser', engine: 'unity', status: 'playable', year: '2026', role: 'programmer, game designer' },
      tools: [],
      embed: { build: './games/pingala/Build/pingalaweb', width: 405, height: 720 },
      links: { play: './games/pingala/', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'khali',
      name: 'khali',
      tag: 'video game',
      blurb: '',
      about: [],
      did: [],
      facts: { genre: '', platform: '', engine: '', status: '', year: '', role: '' },
      tools: [],
      links: { play: '', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'disco-market',
      jam: true,
      name: 'disco market',
      tag: 'video game',
      cover: './covers/disco-market-v3.webp',
      blurb: 'a rhythm game about being the best unappreciated dj in a supermarket.',
      about: ['the theme for gmtk game jam 2025 was "loop".', 'we turned the theme into a music loop where the scanning machine at the supermarket glitches and keeps repeating the scanned object\'s beeps while accidentally making music out of them.', 'we were planning to add a gameplay of customers looking for certain items from their shopping list and making music with them but did not manage to, instead we have the best music making software out there.'],
      did: [],
      facts: { genre: 'rhythm', platform: 'windows', engine: 'godot', status: 'released', year: '2025', role: 'art, programming' },
      tools: ['clip studio paint'],
      links: { play: '', itch: 'https://thesenpie.itch.io/disco-market', store: '', github: '', ggd: '' },
      shots: []
    }
  ];

  const LINK_NAMES = {
    play: 'play in browser',
    itch: 'itch.io',
    store: 'google play',
    appstore: 'app store',
    github: 'github',
    ggd: 'game design doc (pdf)',
    trailer: 'trailer'
  };

  function gameCard(g) {
    return `
      <a class="game" href="#${g.key}">
        <span class="cover-box">
          <canvas class="cover" data-toy="${g.key}"></canvas>
          ${g.cover ? `<img class="cover-pic" src="${g.cover}" alt="" loading="lazy">` : ''}
        </span>
        <div class="body">
          <p class="name">${g.name}</p>
          <span class="tag">${g.tag}</span>
          ${g.blurb ? `<p>${g.blurb}</p>` : ''}
        </div>
      </a>`;
  }

  function gamePage(g) {
    const keys = Object.keys(LINK_NAMES).filter(k => g.links[k] && !(g.embed && k === 'play'));
    const main = g.embed ? null : ['play', 'itch', 'store', 'appstore'].find(k => g.links[k]);
    const links = keys.map(k =>
      `<a class="${k === main ? 'main' : ''}" href="${g.links[k]}" target="_blank" rel="noopener">${LINK_NAMES[k]}</a>`
    ).join('');
    const about = g.about.length ? g.about.map(t => `<p>${t}</p>`).join('') : `<p>${g.blurb || 'more about this one soon.'}</p>`;
    const text = `
      ${links ? `<div class="get">${links}</div>` : ''}
      <div class="block">
        <p class="page-title">about</p>
        ${about}
      </div>
      ${g.did.length ? `
      <div class="block">
        <p class="page-title">what i did</p>
        <ul class="did">${g.did.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>` : ''}
      ${g.shots.length ? `
      <div class="block">
        <p class="page-title">screenshots</p>
        <div class="shots">${g.shots.map(src => `<img src="${src}" alt="${g.name}">`).join('')}</div>
      </div>` : ''}`;
    return `
      <p class="back"><a href="#games">&lt; all games</a></p>
      <div class="detail-head">
        <p class="page-title">${g.name}</p>
        <span class="tag">${g.tag}</span>
      </div>
      ${g.embed ? `
      <div class="play-row">
        <div class="player-col">
          <div class="player loading" style="aspect-ratio: ${g.embed.width} / ${g.embed.height}">
            <canvas class="player-game" id="player-game" tabindex="-1"></canvas>
            <div class="player-bar"><i></i></div>
          </div>
        </div>
        <div class="play-text">${text}</div>
      </div>` : `
      <div class="hero">${g.cover ? `<img src="${g.cover}" alt="${g.name}" width="1280" height="720">` : `<canvas data-toy="${g.key}"></canvas>`}</div>
      ${text}`}
    `;
  }


  function gameWing(g) {
    const rows = Object.keys(g.facts).map(k =>
      `<div><dt>${k}</dt><dd>${g.facts[k] || '-'}</dd></div>`
    ).join('');
    return `
      <p class="page-title">at a glance</p>
      <dl class="facts">${rows}</dl>
      <p class="page-title">additional tools</p>
      <p class="tools">${g.tools.length ? g.tools.map(t => `<span>${t}</span>`).join('') : '-'}</p>
    `;
  }


  const sections = {
    games: `
      <p class="page-title">games</p>
      <div class="games">
        <p class="page-title group-title">personal projects</p>
        <div class="games-grid">${GAMES.filter(g => !g.jam).map(gameCard).join('')}
        </div>
        <p class="page-title group-title">game jams</p>
        <div class="games-grid">${GAMES.filter(g => g.jam).map(gameCard).join('')}
        </div>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <p>some other silly things i am working/worked on</p>
    `,
  };

  const wings = {
    games: `
      <div class="card intro">
        <img src="./desk.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="email">email: <span class="email-wrap"><span id="email">maritamovsisyan@gmail.com</span><button type="button" class="copy" title="copy email" onclick="copyEmail(this)"><svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></span></p>
        <p>game designer and developer in yerevan. i work on live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./resume.pdf" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
  };

  GAMES.forEach(g => {
    sections[g.key] = gamePage(g);
    wings[g.key] = gameWing(g);
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  function closeLightbox() {
    lightbox.classList.remove('active');
  }
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  var player = null;
  function stopPlayer() {
    if (player) player.Quit().catch(() => {});
    player = null;
  }
  function loadScript(src) {
    return new Promise((ok, fail) => {
      const js = document.createElement('script');
      js.src = src;
      js.onload = ok;
      js.onerror = fail;
      document.head.appendChild(js);
    });
  }
  function startPlayer(key) {
    const g = GAMES.find(x => x.key === key), b = g.embed.build;
    const box = document.querySelector('.player'), bar = box.querySelector('.player-bar i');
    const ready = window.createUnityInstance ? Promise.resolve() : loadScript(b + '.loader.js');
    ready.then(() => createUnityInstance(document.getElementById('player-game'), {
      dataUrl: b + '.data.unityweb',
      frameworkUrl: b + '.framework.js.unityweb',
      codeUrl: b + '.wasm.unityweb',
      companyName: 'karmirarev',
      productName: g.name,
      productVersion: '1.0'
    }, p => { bar.style.width = (p * 100) + '%'; })).then(inst => {
      if (!document.getElementById('player-game')) { inst.Quit(); return; }
      player = inst;
      box.classList.remove('loading');
      box.classList.add('running');
    }).catch(() => {
      box.classList.remove('loading');
      box.querySelector('.player-bar').hidden = true;
      box.insertAdjacentHTML('beforeend', '<p class="player-error">the game could not load, try reloading the page.</p>');
    });
  }

  function show(section) {
    stopPlayer();
    document.getElementById('content').innerHTML = sections[section];
    const wing = document.getElementById('wing');
    wing.innerHTML = wings[section] || '';
    wing.classList.remove('only-toy');
    document.querySelectorAll('.shots img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      });
    });
    if (GAMES.some(g => g.key === section)) window.scrollTo(0, 0);
    const game = GAMES.find(g => g.key === section);
    if (game && game.embed) startPlayer(game.key);
    if (window.startToys) window.startToys();
  }

  function copyEmail(btn) {
    var text = document.getElementById('email').textContent;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 1500);
    });
  }
</script>

<script src="/nav.js?v=20"></script>
<script src="/toys.js?v=19"></script>
<script>if (window.startToys) window.startToys();</script>
</body>
</html>
