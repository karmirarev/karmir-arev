          ${g.video ? `<video class="cover-pic" src="${g.video}" poster="${g.cover}" muted loop playsinline preload="none"></video>` : g.cover ? `<img class="cover-pic" src="${g.cover}" alt="" loading="lazy">` : ''}
        </span>
        <div class="body">
          <p class="name">${g.name}</p>
          <span class="tag">${g.tag}</span>
          ${g.blurb ? `<p>${g.blurb}</p>` : ''}
        </div>
      </a>`;
  }

  function gamePage(g) {
    const always = ['github', 'gdd'];
    const keys = Object.keys(LINK_NAMES).filter(k => (g.links[k] || always.includes(k)) && !(g.embed && k === 'play'));
    const main = g.embed ? null : ['play', 'itch', 'store', 'appstore'].find(k => g.links[k]);
    const links = keys.map(k => g.links[k]
      ? `<a class="${k === main ? 'main' : ''}" href="${g.links[k]}" target="_blank" rel="noopener">${LINK_NAMES[k]}</a>`
      : `<span>${LINK_NAMES[k]} -</span>`
    ).join('');
    const about = g.about.length ? g.about.map(t => `<p>${t}</p>`).join('') : `<p>${g.blurb || 'more about this one soon.'}</p>`;
    const text = `
      ${links ? `<div class="get">${links}</div>` : ''}
      <div class="block">
        <p class="page-title">about</p>
        ${about}
      </div>
      ${g.did.length ? `
      <div class="block">
        <p class="page-title">what i did</p>
        <ul class="did">${g.did.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>` : ''}
      ${g.shots.length ? `
      <div class="block">
        <p class="page-title">screenshots</p>
        <div class="shots">${g.shots.map(src => `<img src="${src}" alt="${g.name}">`).join('')}</div>
      </div>` : ''}`;
    return `
      <p class="back"><a href="#games">&lt; all games</a></p>
      <div class="detail-head">
        <p class="page-title">${g.name}</p>
        <span class="tag">${g.tag}</span>
      </div>
      ${g.embed ? `
      <div class="play-row">
        <div class="player-col">
          <div class="player ${g.embed.page ? 'running' : 'loading'}" style="aspect-ratio: ${g.embed.width} / ${g.embed.height}">
            ${g.embed.page ? `<iframe class="player-game" src="${g.embed.page}" title="${g.name}"></iframe>` : `
            <canvas class="player-game" id="player-game" tabindex="-1"></canvas>
            <div class="player-bar"><i></i></div>`}
          </div>
        </div>
        <div class="play-text">${text}</div>
      </div>` : `
      <div class="hero">${g.video ? `<video src="${g.video}" poster="${g.cover}" width="1280" height="720" autoplay muted loop playsinline></video>` : g.cover ? `<img src="${g.cover}" alt="${g.name}" width="1280" height="720">` : `<canvas data-toy="${g.key}"></canvas>`}</div>
      ${text}`}
    `;
  }


  function compare(c) {
    return `
        <div class="compare">${['before', 'after'].map(k => `
          <figure>
            <figcaption>${k}:</figcaption>
            <video src="${c[k]}" width="${c.width}" height="${c.height}" autoplay muted loop playsinline></video>
          </figure>`).join('')}
        </div>`;
  }

  function docPill(d, cls) {
    return d.file
      ? `<a class="${cls}" href="${d.file}" download>${d.name}</a>`
      : `<span class="${cls}">${d.name} -</span>`;
  }

  function subMap(m, doc) {
    const beats = m.acts.flatMap(a => a.beats);
    const pins = beats.filter(b => b[1] !== null);
    const pin = b => `pin${b[0] === m.reveal ? ' reveal' : ''}${b[1] === null ? ' end' : ''}`;
    return `
        <p class="map-intro">${m.intro} ${doc ? docPill(doc, 'pill') : ''}</p>
        <div class="sub-map">
          <div class="sub">
            <img src="${m.img}" width="${m.width}" height="${m.height}" alt="${m.alt}" loading="lazy">
            <svg viewBox="0 0 ${m.width} ${m.height}"><polyline points="${pins.map(b => b[1] * m.width / 100 + ',' + b[2] * m.height / 100).join(' ')}"/></svg>
            ${pins.map(b => `<span class="${pin(b)}" data-beat="${b[0]}" style="left: ${b[1]}%; top: ${b[2]}%">${b[0]}</span>`).join('')}
          </div>
          <div class="beats">${m.acts.map(a => `
            <p class="act">${a.name} <span>${a.note}</span></p>
            <ul>${a.beats.map(b => `<li data-beat="${b[0]}"><span class="${pin(b)}">${b[0]}</span><span><b>${b[3]}.</b> ${b[4]}</span></li>`).join('')}</ul>`).join('')}
          </div>
        </div>`;
  }

  function studioPage(g) {
    const games = g.work.map(w => {
      const links = Object.keys(LINK_NAMES).filter(k => w.links[k]).map((k, i) =>
        `<a class="${i ? '' : 'main'}" href="${w.links[k]}" target="_blank" rel="noopener">${LINK_NAMES[k]}</a>`
      ).join('') + (w.doc && !w.map ? docPill(w.doc, '') : '');
      const clips = !w.clips ? '' : w.clips.length
        ? w.clips.map(src => `<video src="${src}" autoplay muted loop playsinline></video>`).join('')
        : '<p class="clip-soon">clips soon</p>';
      return `
      <div class="block work">
        <div class="detail-head">
          <p class="page-title">${w.name}</p>
          <span class="tag">${w.tag}</span>
        </div>
        ${links ? `<div class="get">${links}</div>` : ''}
        ${w.text.map(t => `<p>${t}</p>`).join('')}
        ${w.did ? `<ul class="did">${w.did.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
        ${clips ? `<div class="clips">${clips}</div>` : ''}
        ${w.compare ? compare(w.compare) : ''}
        ${w.map ? subMap(w.map, w.doc) : ''}
      </div>`;
    }).join('');
    return `
      <p class="back"><a href="#games">&lt; all games</a></p>
      <div class="detail-head">
        <p class="page-title">${g.name}</p>
        <span class="tag">${g.tag}</span>
      </div>
      ${g.about.map(t => `<p>${t}</p>`).join('')}
      ${games}
    `;
  }


  function gameWing(g) {
    const rows = Object.keys(g.facts).map(k =>
      `<div><dt>${k}</dt><dd>${g.facts[k] || '-'}</dd></div>`
    ).join('');
    return `
      <p class="page-title">at a glance</p>
      <dl class="facts">${rows}</dl>
      <p class="page-title">additional tools</p>
      <p class="tools">${g.tools.length ? g.tools.map(t => `<span>${t}</span>`).join('') : '-'}</p>
    `;
  }


  const sections = {
    games: `
      <p class="page-title">games</p>
      <div class="games">
        <p class="page-title group-title">studio work</p>
        <div class="games-grid">${GAMES.filter(g => g.work).map(gameCard).join('')}
        </div>
        <p class="page-title group-title">personal projects</p>
        <div class="games-grid">${GAMES.filter(g => !g.jam && !g.work).map(gameCard).join('')}
        </div>
        <p class="page-title group-title">game jams</p>
        <div class="games-grid">${GAMES.filter(g => g.jam).map(gameCard).join('')}
        </div>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <div class="games">
        <p>some other silly things i am working/worked on</p>
        <div class="games-grid">${OTHER.map(otherCard).join('')}
        </div>
      </div>
    `,
  };

  const wings = {
    games: `
      <div class="card intro">
        <img src="./desk.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="email">email: <span class="email-wrap"><span id="email">maritamovsisyan@gmail.com</span><button type="button" class="copy" title="copy email" onclick="copyEmail(this)"><svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></span></p>
        <p>game designer and developer in yerevan. i work on live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./marita-movsisyan-cv.pdf?v=3" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
  };

  wings.other = wings.games;

  GAMES.forEach(g => {
    sections[g.key] = g.work ? studioPage(g) : gamePage(g);
    wings[g.key] = gameWing(g);
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  function closeLightbox() {
    lightbox.classList.remove('active');
  }
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  document.getElementById('wing').innerHTML = wings.games;
  document.getElementById('wing').classList.remove('only-toy');
  const landing = {
    content: [...document.getElementById('content').childNodes],
    wing: [...document.getElementById('wing').childNodes]
  };
  function showLanding() {
    stopPlayer();
    document.getElementById('content').replaceChildren(...landing.content);
    const wing = document.getElementById('wing');
    wing.replaceChildren(...landing.wing);
    wing.classList.remove('cites');
    if (window.startToys) window.startToys();
  }

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
    else showLanding();
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  var player = null;
  function stopPlayer() {
    if (player) player.Quit().catch(() => {});
    player = null;
  }
  function loadScript(src) {
    return new Promise((ok, fail) => {
      const js = document.createElement('script');
      js.src = src;
      js.onload = ok;
      js.onerror = fail;
      document.head.appendChild(js);
    });
  }
  function startPlayer(key) {
    const g = GAMES.find(x => x.key === key), b = g.embed.build;
    const box = document.querySelector('.player'), bar = box.querySelector('.player-bar i');
    const ready = window.createUnityInstance ? Promise.resolve() : loadScript(b + '.loader.js');
    ready.then(() => createUnityInstance(document.getElementById('player-game'), {
      dataUrl: b + '.data.unityweb',
      frameworkUrl: b + '.framework.js.unityweb',
      codeUrl: b + '.wasm.unityweb',
      companyName: 'karmirarev',
      productName: g.name,
      productVersion: '1.0'
    }, p => { bar.style.width = (p * 100) + '%'; })).then(inst => {
      if (!document.getElementById('player-game')) { inst.Quit(); return; }
      player = inst;
      box.classList.remove('loading');
      box.classList.add('running');
    }).catch(() => {
      box.classList.remove('loading');
      box.querySelector('.player-bar').hidden = true;
      box.insertAdjacentHTML('beforeend', '<p class="player-error">the game could not load, try reloading the page.</p>');
    });
  }

  function show(section) {
    stopPlayer();
    document.getElementById('content').innerHTML = sections[section];
    const wing = document.getElementById('wing');
    wing.innerHTML = wings[section] || '';
    wing.classList.remove('only-toy');
    document.querySelectorAll('.shots img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      });
    });
    document.querySelectorAll('.hero video, .clips video, .compare video').forEach(v => v.play().catch(() => {}));
    document.querySelectorAll('[data-beat]').forEach(el => {
      const same = () => document.querySelectorAll(`[data-beat="${el.dataset.beat}"]`);
      el.addEventListener('mouseenter', () => same().forEach(x => x.classList.add('on')));
      el.addEventListener('mouseleave', () => same().forEach(x => x.classList.remove('on')));
    });
    document.querySelectorAll('a.game').forEach(card => {
      const v = card.querySelector('video.cover-pic');
      if (!v) return;
      card.addEventListener('mouseenter', () => v.play().catch(() => {}));
      card.addEventListener('mouseleave', () => v.pause());
    });
    if (GAMES.some(g => g.key === section)) window.scrollTo(0, 0);
    const game = GAMES.find(g => g.key === section);
    if (game && game.embed && game.embed.build) startPlayer(game.key);
    if (window.startToys) window.startToys();
  }

  function copyEmail(btn) {
    var text = document.getElementById('email').textContent;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 1500);
    });
  }
</script>

<script src="/nav.js?v=81"></script>
<script src="/toys.js?v=33"></script>
<script>if (window.startToys) window.startToys();</script>
