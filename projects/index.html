<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects - karmirarev</title>
  <link rel="stylesheet" href="../gallery.css?v=5">
  <link rel="stylesheet" href="../site.css?v=29">
  <style>
    .content {
      position: relative;
      overflow: hidden;
    }
    .games {
      margin-top: 16px;
    }
    .games > :first-child {
      margin-top: 0;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }
    .game {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      overflow: hidden;
      display: block;
      color: inherit;
      text-decoration: none;
    }
    a.game:hover {
      background: var(--lime);
      text-decoration: none;
    }
    .game .cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid var(--maroon);
      background: var(--paper);
    }
    .game canvas.cover {
      cursor: pointer;
    }
    .game canvas.cover.no-gl {
      background-image: repeating-linear-gradient(45deg, transparent 0 10px, rgba(145, 18, 84, 0.12) 10px 12px);
    }
    .game .body {
      padding: 10px 12px 12px;
    }
    .game .name {
      color: var(--maroon);
      font-weight: bold;
      margin: 0 0 6px;
    }
    .game .tag {
      display: inline-block;
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .tag {
      background: #C1BCD7;
    }
    .game p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      padding: 16px 20px;
      margin-bottom: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .card:last-child {
      margin-bottom: 0;
    }
    .card.intro {
      border: 0;
      box-shadow: none;
      background: transparent;
      padding: 0;
    }
    .wing {
      position: relative;
    }
    .card > :first-child {
      margin-top: 0;
    }
    .card > :last-child {
      margin-bottom: 0;
    }
    .card img {
      display: block;
      width: 240px;
      max-width: 100%;
      margin: 0 auto 16px;
    }
    .card .name {
      margin-bottom: 2px;
    }
    .card .email {
      margin-top: 2px;
    }
    .email-wrap {
      white-space: nowrap;
    }
    .copy {
      font: inherit;
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 6px;
      border: 1px solid var(--maroon);
      border-radius: 2px;
      background: transparent;
      color: var(--maroon);
      cursor: pointer;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy:hover {
      background: var(--lime);
    }
    .copy svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy .check {
      display: none;
    }
    .copy.done {
      border-color: var(--green);
      color: var(--green);
    }
    .copy.done .clip {
      display: none;
    }
    .copy.done .check {
      display: block;
    }
    .card p {
      line-height: 1.5;
    }
    .find a {
      display: inline-block;
      margin-right: 16px;
    }
    .back {
      margin: 0 0 14px;
      font-size: 13px;
    }
    .detail-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
    }
    .detail-head .page-title {
      margin: 0;
      font-size: 22px;
    }
    .detail-head .tag {
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--maroon);
      border-radius: 3px;
    }
    .hero {
      margin: 16px 0;
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      overflow: hidden;
    }
    .hero canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      cursor: pointer;
    }
    .hero canvas.no-gl {
      background-image: repeating-linear-gradient(45deg, transparent 0 10px, rgba(145, 18, 84, 0.12) 10px 12px);
    }
    .get {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }
    .get a {
      padding: 3px 12px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
      background: var(--paper);
      text-decoration: none;
      font-size: 14px;
    }
    .get a.main {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .get a:hover {
      background: var(--lime);
      border-color: var(--maroon);
      color: #1b1b1b;
      text-decoration: none;
    }
    .block {
      border: 1px solid var(--maroon);
      border-radius: 14px;
      box-shadow: 4px 4px 0 #C1BCD7;
      background: var(--paper);
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .block > :first-child {
      margin-top: 0;
    }
    .block > :last-child {
      margin-bottom: 0;
    }
    .block p {
      line-height: 1.6;
    }
    .did {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .did li {
      position: relative;
      padding: 4px 0 4px 20px;
      line-height: 1.5;
    }
    .did li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.62em;
      width: 9px;
      height: 9px;
      box-sizing: border-box;
      border: 1px solid var(--maroon);
      border-radius: 2px;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .shots img {
      display: block;
      width: 100%;
      border: 1px solid var(--maroon);
      border-radius: 6px;
      cursor: pointer;
    }
    .shots img:hover {
      outline: 2px solid var(--green);
    }
    .facts {
      margin: 12px 0 24px;
    }
    .facts div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--maroon);
    }
    .facts dt {
      color: var(--maroon);
    }
    .facts dd {
      margin: 0;
      text-align: right;
    }
    .made span {
      display: inline-block;
      margin: 0 6px 6px 0;
      padding: 2px 10px;
      border: 1px solid var(--maroon);
      border-radius: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="wing only-toy" id="wing"><canvas class="wing-toy" data-toy="wing-projects"></canvas></div>
  <div class="content" id="content">
    <p class="page-title">projects</p>
    <p>projects i am working/worked on during free time</p>
  </div>

  <div class="menu" id="menu"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">x</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const GAMES = [
    {
      key: 'sandsong',
      name: 'sandsong',
      tag: 'mobile game',
      blurb: 'a top-down mobile puzzle game about playing a flute to shape sand into pattern-paths across a field of a dangerous desert.',
      about: [],
      did: [],
      facts: { year: '', platform: 'mobile', engine: '', role: '', team: '', status: '' },
      made: [],
      links: { play: '', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'kami-hovani',
      name: 'kami hovani',
      tag: 'video game',
      blurb: '',
      about: [],
      did: [],
      facts: { year: '', platform: '', engine: '', role: '', team: '', status: '' },
      made: [],
      links: { play: '', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'bebe-heist',
      name: 'bebe heist',
      tag: 'video game',
      blurb: '',
      about: [],
      did: [],
      facts: { year: '', platform: 'browser', engine: 'javascript', role: '', team: '', status: 'playable' },
      made: [],
      links: { play: './games/bebe-heist/', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'pingala',
      name: 'pingala',
      tag: 'mobile game',
      blurb: 'a single player code-breaking game',
      about: [],
      did: [],
      facts: { year: '', platform: 'mobile, browser', engine: 'unity', role: '', team: '', status: 'playable' },
      made: ['unity'],
      links: { play: './games/pingala/', itch: '', store: '', github: '', ggd: '' },
      shots: []
    },
    {
      key: 'khali',
      name: 'khali',
      tag: 'video game',
      blurb: '',
      about: [],
      did: [],
      facts: { year: '', platform: '', engine: '', role: '', team: '', status: '' },
      made: [],
      links: { play: '', itch: '', store: '', github: '', ggd: '' },
      shots: []
    }
  ];

  const LINK_NAMES = {
    play: 'play in browser',
    itch: 'itch.io',
    store: 'google play',
    appstore: 'app store',
    github: 'github',
    ggd: 'game design doc (pdf)',
    trailer: 'trailer'
  };

  function gameCard(g) {
    return `
      <a class="game" href="#${g.key}">
        <canvas class="cover" data-toy="${g.key}"></canvas>
        <div class="body">
          <p class="name">${g.name}</p>
          <span class="tag">${g.tag}</span>
          ${g.blurb ? `<p>${g.blurb}</p>` : ''}
        </div>
      </a>`;
  }

  function gamePage(g) {
    const links = Object.keys(LINK_NAMES).filter(k => g.links[k]).map(k =>
      `<a class="${k === 'play' ? 'main' : ''}" href="${g.links[k]}" target="_blank" rel="noopener">${LINK_NAMES[k]}</a>`
    ).join('');
    const about = g.about.length ? g.about.map(t => `<p>${t}</p>`).join('') : `<p>${g.blurb || 'more about this one soon.'}</p>`;
    return `
      <p class="back"><a href="#games">&lt; all games</a></p>
      <div class="detail-head">
        <p class="page-title">${g.name}</p>
        <span class="tag">${g.tag}</span>
      </div>
      <div class="hero"><canvas data-toy="${g.key}"></canvas></div>
      ${links ? `<div class="get">${links}</div>` : ''}
      <div class="block">
        <p class="page-title">about</p>
        ${about}
      </div>
      ${g.did.length ? `
      <div class="block">
        <p class="page-title">what i did</p>
        <ul class="did">${g.did.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>` : ''}
      ${g.shots.length ? `
      <div class="block">
        <p class="page-title">screenshots</p>
        <div class="shots">${g.shots.map(src => `<img src="${src}" alt="${g.name}">`).join('')}</div>
      </div>` : ''}
    `;
  }

  function gameWing(g) {
    const rows = Object.keys(g.facts).filter(k => g.facts[k]).map(k =>
      `<div><dt>${k}</dt><dd>${g.facts[k]}</dd></div>`
    ).join('');
    return `
      <p class="page-title">at a glance</p>
      <dl class="facts">
        <div><dt>type</dt><dd>${g.tag}</dd></div>
        ${rows}
      </dl>
      ${g.made.length ? `
      <p class="page-title">made with</p>
      <p class="made">${g.made.map(t => `<span>${t}</span>`).join('')}</p>` : ''}
    `;
  }

  const sections = {
    games: `
      <p class="page-title">games</p>
      <div class="games">
        <div class="games-grid">${GAMES.map(gameCard).join('')}
        </div>
      </div>
    `,
    other: `
      <p class="page-title">other</p>
      <p>some other silly things i am working/worked on</p>
    `,
  };

  const wings = {
    games: `
      <div class="card intro">
        <img src="./desk.gif" alt="pixel me at my desk">
        <p class="page-title name">marita movsisyan</p>
        <p class="email">email: <span class="email-wrap"><span id="email">maritamovsisyan@gmail.com</span><button type="button" class="copy" title="copy email" onclick="copyEmail(this)"><svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></span></p>
        <p>game designer and developer in yerevan. i work on live mobile games at rockbite and make my own on the side: design docs, code, and art included!</p>
      </div>

      <div class="card find">
        <p class="page-title">find me on</p>
        <p>
          <a href="https://www.linkedin.com/in/marita-movsisyan-155a3425b/" target="_blank" rel="noopener">linkedin</a>
        </p>
      </div>

      <div class="card">
        <p><a href="./resume.pdf" target="_blank" rel="noopener">download resume (pdf)</a></p>
      </div>
    `,
  };

  GAMES.forEach(g => {
    sections[g.key] = gamePage(g);
    wings[g.key] = gameWing(g);
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  function closeLightbox() {
    lightbox.classList.remove('active');
  }
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
    const wing = document.getElementById('wing');
    wing.innerHTML = wings[section] || '';
    wing.classList.remove('only-toy');
    document.querySelectorAll('.shots img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      });
    });
    if (GAMES.some(g => g.key === section)) window.scrollTo(0, 0);
    if (window.startToys) window.startToys();
  }

  function copyEmail(btn) {
    var text = document.getElementById('email').textContent;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      setTimeout(function () { btn.classList.remove('done'); }, 1500);
    });
  }
</script>

<script src="/nav.js?v=17"></script>
<script src="/toys.js?v=14"></script>
<script>if (window.startToys) window.startToys();</script>
</body>
</html>
