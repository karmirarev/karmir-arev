name: latest film, anime, manga and book

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/letterboxd.py
      - run: python3 .github/scripts/anilist.py
      - run: python3 .github/scripts/goodreads.py
      - run: |
          if [ -z "$(git status --porcelain -- letterboxd.json anilist.json anilist-manga.json goodreads.json)" ]; then exit 0; fi
          git config user.name 'site bot'
          git config user.email 'actions@users.noreply.github.com'
          git add letterboxd.json anilist.json $(ls anilist-manga.json goodreads.json 2>/dev/null)
          git commit -m 'latest film, anime, manga and book'
          git push
