name: latest film and anime

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/letterboxd.py
      - run: python3 .github/scripts/anilist.py
      - run: |
          if git diff --quiet letterboxd.json anilist.json; then exit 0; fi
          git config user.name 'site bot'
          git config user.email 'actions@users.noreply.github.com'
          git add letterboxd.json anilist.json
          git commit -m 'latest film and anime'
          git push
