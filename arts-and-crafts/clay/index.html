<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clay - karmirarev</title>
  <link rel="stylesheet" href="../../gallery.css">
  <link rel="stylesheet" href="../../site.css">
</head>
<body>

<div class="page-layout">
  <div class="content">
    <p>clay</p>
    <br>

    <div class="gallery" id="gallery">
    </div>

    <div class="lightbox" id="lightbox">
      <span class="lightbox-close" onclick="closeLightbox()">x</span>
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <div class="menu">
    <p class="menu-home"><a href="../../">home</a></p>
    <p><a href="../">arts and crafts</a></p>
    <hr>
    <p><a href="../digital-mixed-media">digital-mixed-media</a></p>
    <p class="menu-current">clay</p>
    <p><a href="../papercraft">papercraft</a></p>
    <p><a href="../events-markets-exhibits">events-markets-exhibits</a></p>
  </div>
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
