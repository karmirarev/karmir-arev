<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>papercraft - karmirarev</title>
  <link rel="stylesheet" href="../../gallery.css?v=4">
  <link rel="stylesheet" href="../../site.css?v=13">
</head>
<body>

<div class="page-layout">
  <div class="content">
    <p class="page-title">papercraft</p>
    <br>

    <div class="gallery" id="gallery">
      <div class="gallery-item"><img src="saber.jpg" alt="saber"></div>
    </div>

    <div class="lightbox" id="lightbox">
      <span class="lightbox-close" onclick="closeLightbox()">x</span>
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <div class="menu" id="menu"></div>
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

<script src="/nav.js?v=7"></script>
</body>
</html>
