<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arts and crafts - karmirarev</title>
  <link rel="stylesheet" href="../gallery.css?v=6">
  <link rel="stylesheet" href="../site.css?v=84">
  <style>
    .model-wrap {
      position: relative;
      max-width: 460px;
      margin: 0 auto;
      overflow: hidden;
    }
    .credit {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      margin: 10px 0 0;
      line-height: 1.5;
    }
    .credit dt {
      color: var(--maroon);
      font-size: 12px;
      line-height: 1.9;
    }
    .credit dd {
      margin: 0;
      overflow-wrap: anywhere;
    }
    .piece {
      max-width: 460px;
      margin: 0 auto;
      padding-bottom: 18px;
    }
    .piece img {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
    }
    .piece img:hover {
      outline: 2px solid var(--green);
    }
    .model-loading {
      position: absolute;
      left: 20%;
      right: 20%;
      top: 45%;
      margin: 0;
      text-align: center;
      font-size: 13px;
      color: var(--maroon);
      pointer-events: none;
    }
    .model-loading[hidden] {
      display: none;
    }
    .model-bar {
      display: block;
      height: 10px;
      margin-top: 8px;
      border: 1px solid var(--maroon);
      border-radius: 5px;
      background: var(--paper);
      overflow: hidden;
    }
    .model-bar i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--green);
    }
    .model {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      margin: -20% 0 -6%;
      background: transparent;
      --poster-color: transparent;
    }
    .content {
      position: relative;
      overflow: hidden;
    }
    .content:has(.parade) {
      display: flex;
      flex-direction: column;
    }
    .parade {
      margin: auto 0 -8px;
      padding-top: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .parade img {
      flex-shrink: 0;
    }
    @media (max-width: 700px) {
      .parade {
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 4%;
      }
      .parade img {
        width: calc(var(--w) * 2);
      }
    }
    .empty-note {
      color: var(--maroon);
    }
    .event {
      padding: 4px 0 24px;
      border-bottom: 1px dashed var(--orange);
    }
    .event:last-child {
      border-bottom: 0;
    }
    .when {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--maroon);
      margin: 0 0 10px;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .shots {
      align-items: start;
    }
    .shots img {
      width: 100%;
      height: auto;
      display: block;
    }
    .shots.byob {
      grid-template-columns: calc((100% - 26px) / 2.3593) 1fr;
    }
    .shots.market {
      grid-template-columns: 0.7641fr 0.75fr 0.75fr;
    }
    .shots.byob .me {
      grid-column: 2;
      grid-row: 1 / span 3;
    }
    .shots img {
      cursor: pointer;
    }
    .shots img:hover {
      outline: 2px solid var(--green);
    }
    .story {
      box-sizing: border-box;
      padding: 4px 0 18px;
      margin-bottom: 18px;
      border-bottom: 1px dashed var(--orange);
    }
    .event {
      box-sizing: border-box;
    }
    .story:last-child {
      border-bottom: 0;
      margin-bottom: 0;
    }
    .event.keep-line,
    .story.keep-line {
      border-bottom: 1px dashed var(--orange);
    }
    .story .when {
      margin-bottom: 2px;
    }
    .story .page-title {
      margin-top: 0;
    }
    .story p {
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="wing only-toy" id="wing"><canvas class="wing-toy" data-toy="wing-arts"></canvas></div>
  <div class="content" id="content">
        <p class="page-title">arts and crafts</p>
        <p>artsy stuff i am working/worked on</p>
    <div class="folders" data-folders="/arts-and-crafts/"></div>
    <div class="parade">
      <img src="./deco/seal.png" alt="" style="--w:9.4%;width:var(--w)">
      <img src="./deco/moth.png" alt="" style="--w:14.5%;width:var(--w)">
      <img src="./deco/funnelman.png" alt="" style="--w:12.5%;width:var(--w)">
      <img src="./deco/chairbird.png" alt="" style="--w:16.1%;width:var(--w)">
      <img src="./deco/frog.png" alt="" style="--w:5.7%;width:var(--w)">
      <img src="./deco/snailhare.png" alt="" style="--w:10.3%;width:var(--w)">
      <img src="./deco/dog.png" alt="" style="--w:11.8%;width:var(--w)">
      <img src="./deco/turtle.png" alt="" style="--w:11.8%;width:var(--w)">
    </div>
  </div>

  <div class="menu" id="menu"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">x</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const sections = {
    'drawings': `
      <p class="page-title">drawings</p>
      <div class="event">
        <p class="empty-note">nothing here yet</p>
      </div>
      <div class="event">
        <div class="gallery">
          <div class="gallery-item"><img src="./thumbs/teinik.webp" data-full="./digital-mixed-media/teinik.webp" width="560" height="700" loading="lazy" alt="teinik"></div>
          <div class="gallery-item"><img src="./thumbs/artemis.webp" data-full="./digital-mixed-media/artemis.webp" width="560" height="448" loading="lazy" alt="artemis"></div>
          <div class="gallery-item"><img src="./thumbs/astral.webp" data-full="./digital-mixed-media/astral.webp" width="560" height="700" loading="lazy" alt="astral"></div>
          <div class="gallery-item"><img src="./thumbs/ballladies.webp" data-full="./digital-mixed-media/ballladies.webp" width="560" height="792" loading="lazy" alt="ballladies"></div>
          <div class="gallery-item"><img src="./thumbs/blob.webp" data-full="./digital-mixed-media/blob.webp" width="560" height="407" loading="lazy" alt="blob"></div>
          <div class="gallery-item"><img src="./thumbs/boyfriend.webp" data-full="./digital-mixed-media/boyfriend.webp" width="560" height="726" loading="lazy" alt="boyfriend"></div>
          <div class="gallery-item"><img src="./thumbs/horselady.webp" data-full="./digital-mixed-media/horselady.webp" width="560" height="792" loading="lazy" alt="horselady"></div>
          <div class="gallery-item"><img src="./thumbs/howmybfseesme.webp" data-full="./digital-mixed-media/howmybfseesme.webp" width="560" height="327" loading="lazy" alt="howmybfseesme"></div>
          <div class="gallery-item"><img src="./thumbs/icanseeyourface.webp" data-full="./digital-mixed-media/icanseeyourface.webp" width="560" height="641" loading="lazy" alt="icanseeyourface"></div>
          <div class="gallery-item"><img src="./thumbs/knightlady.webp" data-full="./digital-mixed-media/knightlady.webp" width="560" height="792" loading="lazy" alt="knightlady"></div>
          <div class="gallery-item"><img src="./thumbs/pilote.webp" data-full="./digital-mixed-media/pilote.gif" width="560" height="420" loading="lazy" alt="pilote"></div>
          <div class="gallery-item"><img src="./thumbs/prettylady.webp" data-full="./digital-mixed-media/prettylady.webp" width="560" height="641" loading="lazy" alt="prettylady"></div>
          <div class="gallery-item"><img src="./thumbs/sakura.webp" data-full="./digital-mixed-media/sakura.webp" width="560" height="709" loading="lazy" alt="sakura"></div>
          <div class="gallery-item"><img src="./thumbs/spaceseal.webp" data-full="./digital-mixed-media/spaceseal.webp" width="560" height="641" loading="lazy" alt="spaceseal"></div>
          <div class="gallery-item"><img src="./thumbs/theboyandtheheroin.webp" data-full="./digital-mixed-media/theboyandtheheroin.webp" width="560" height="698" loading="lazy" alt="theboyandtheheroin"></div>
          <div class="gallery-item"><img src="./thumbs/theyellowwallpaper.webp" data-full="./digital-mixed-media/theyellowwallpaper.webp" width="560" height="792" loading="lazy" alt="theyellowwallpaper"></div>
        </div>
      </div>
      <div class="event">
        <p class="empty-note">nothing here yet</p>
      </div>
      <div class="event">
        <p class="empty-note">nothing here yet</p>
      </div>
      <div class="event">
        <p class="empty-note">nothing here yet</p>
      </div>
      <div class="event">
        <p class="empty-note">nothing here yet</p>
      </div>
    `,
    'clay': `
      <p class="page-title">clay</p>
      <br>
      <div class="gallery" id="gallery">
      </div>
    `,
    'papercraft': `
      <p class="page-title">papercraft</p>
      <div class="event keep-line">
        <div class="piece"><img class="shot" src="./papercraft/saber.jpg" width="960" height="540" alt="saber papercraft, folded from paper"></div>
      </div>
    `,
    '3d-model-painting': `
      <p class="page-title">3d-model-painting</p>
      <div class="event keep-line">
        <div class="model-wrap"><model-viewer class="model" camera-orbit="180deg 75deg auto" min-camera-orbit="auto 75deg auto" max-camera-orbit="auto 75deg auto" src="./3d-model-painting/figurine-v3.glb" alt="3d printed figurine, painted by hand" camera-controls disable-pan disable-tap auto-rotate auto-rotate-delay="0" rotation-per-second="18deg" disable-zoom touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.6" exposure="1.05"></model-viewer><p class="model-loading">loading<span class="model-bar"><i></i></span></p></div>
      </div>
    `,
    'events-markets-exhibits': `
      <p class="page-title">events-markets-exhibits</p>
      <div class="event">
        <div class="shots byob">
          <img class="shot" src="./thumbs/events/1.webp" data-full="./events-markets-exhibits/1.gif" width="560" height="315" alt="">
          <img class="shot" src="./thumbs/events/2.webp" data-full="./events-markets-exhibits/2.gif" width="560" height="315" alt="">
          <img class="shot" src="./thumbs/events/3.webp" data-full="./events-markets-exhibits/3.gif" width="560" height="315" alt="">
          <img class="shot me" src="./thumbs/events/ikindalookcoolhere.webp" data-full="./events-markets-exhibits/ikindalookcoolhere.jpg" width="560" height="695" alt="">
        </div>
      </div>
      <div class="event">
        <div class="shots market">
          <img class="shot" src="./thumbs/events/4.webp" data-full="./events-markets-exhibits/4.jpg" width="560" height="733" alt="">
          <img class="shot" src="./thumbs/events/5.webp" data-full="./events-markets-exhibits/5.jpg" width="560" height="747" alt="">
          <img class="shot" src="./thumbs/events/7.webp" data-full="./events-markets-exhibits/7.jpg" width="560" height="747" alt="">
        </div>
      </div>
    `,
  };

  const wings = {
    'papercraft': `
      <div class="story keep-line">
        <p class="page-title">saber</p>
        <dl class="credit">
          <dt>franchise</dt><dd>fate/stay night</dd>
          <dt>source</dt><dd><a href="https://mypapercraft.net/fate-stay-night-saber-papercraft/" target="_blank" rel="noopener">mypapercraft.net</a></dd>
        </dl>
      </div>
    `,
    '3d-model-painting': `
      <div class="story keep-line">
        <p class="page-title">ranni the witch</p>
        <dl class="credit">
          <dt>franchise</dt><dd>elden ring</dd>
          <dt>source</dt><dd><a href="https://www.printables.com/model/278192-ranni-the-witch" target="_blank" rel="noopener">printables.com</a></dd>
        </dl>
      </div>
    `,
    'drawings': `
      <div class="story"><p class="page-title">game assets</p></div>
      <div class="story"><p class="page-title">mixed media</p></div>
      <div class="story"><p class="page-title">digital</p></div>
      <div class="story"><p class="page-title">traditional</p></div>
      <div class="story"><p class="page-title">fanarts</p></div>
      <div class="story"><p class="page-title">sketches</p></div>
    `,
    'events-markets-exhibits': `
      <div class="story">
        <p class="when">nov 7, 2025</p>
        <p class="page-title">byob at hosq.co</p>
        <p>took part in BYOB (bring your own beamer) organized by hosq.co. looking back at these drawings, i find them too depressing. i remember drawing them right after i moved out, when i was missing our old village house.</p>
      </div>
      <div class="story">
        <p class="when">nov 22-23, 2025</p>
        <p class="page-title">exhibit-market at qrchi bazaar</p>
        <p>saw an invitation to take part in an exhibit-market in qrchi bazaar with the focus being more on making connections and exchanging items rather than selling them. it actually worked and i met some coolsy people there. one of them even gave me sun shaped red earrings that i wear religiously.</p>
      </div>
    `,
  };

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  const landing = {
    content: [...document.getElementById('content').childNodes],
    wing: [...document.getElementById('wing').childNodes]
  };
  function showLanding() {
    document.getElementById('content').replaceChildren(...landing.content);
    const wing = document.getElementById('wing');
    wing.replaceChildren(...landing.wing);
    wing.classList.add('only-toy');
    wing.classList.remove('cites');
    if (window.startToys) window.startToys();
  }

  function showFromHash() {
    var key = location.hash.slice(1);
    if (key === 'digital-mixed-media') key = 'drawings';
    if (sections[key]) show(key);
    else showLanding();
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function alignEvents() {
    var stories = document.querySelectorAll('#wing .story');
    var events = document.querySelectorAll('#content .event');
    if (!stories.length || stories.length !== events.length) return;
    if (window.innerWidth <= 700) return;
    stories.forEach(function (el) { el.style.marginTop = ''; el.style.minHeight = ''; });
    events.forEach(function (el) { el.style.marginTop = ''; el.style.minHeight = ''; });
    for (var i = 0; i < stories.length; i++) {
      var st = stories[i].getBoundingClientRect().top;
      var et = events[i].getBoundingClientRect().top;
      if (et > st) stories[i].style.marginTop = (et - st) + 'px';
      else if (st > et) events[i].style.marginTop = (st - et) + 'px';
      var h = Math.max(stories[i].getBoundingClientRect().height, events[i].getBoundingClientRect().height);
      stories[i].style.minHeight = h + 'px';
      events[i].style.minHeight = h + 'px';
    }
  }
  window.addEventListener('resize', alignEvents);
  window.addEventListener('load', alignEvents);

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
    const wing = document.getElementById('wing');
    wing.innerHTML = wings[section] || '';
    wing.classList.remove('only-toy');
    document.querySelectorAll('#content img, #content video').forEach(function (m) {
      m.addEventListener('load', alignEvents);
      m.addEventListener('loadedmetadata', alignEvents);
    });
    alignEvents();
    if (window.startToys) window.startToys();
    document.querySelectorAll('#content model-viewer').forEach(mv => {
      const note = mv.parentNode.querySelector('.model-loading'), bar = note.querySelector('i');
      mv.addEventListener('progress', e => { bar.style.width = (e.detail.totalProgress * 100) + '%'; });
      mv.addEventListener('load', () => { note.hidden = true; });
      mv.addEventListener('error', () => { note.firstChild.textContent = 'the 3d model could not load, try reloading the page.'; });
    });
    if (document.querySelector('#content model-viewer') && !document.getElementById('mv-js')) {
      const js = document.createElement('script');
      js.id = 'mv-js';
      js.type = 'module';
      js.src = 'https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js';
      document.head.appendChild(js);
    }
    document.querySelectorAll('.gallery-item img, .shot').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.dataset.full || img.src;
        lightbox.classList.add('active');
      });
    });
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

<script src="/nav.js?v=73"></script>
<script src="/toys.js?v=26"></script>
<script>if (window.startToys) window.startToys();</script>
</body>
</html>
