<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arts and crafts - karmirarev</title>
  <link rel="stylesheet" href="../gallery.css">
  <link rel="stylesheet" href="../site.css">
  <style>
    .event-row {
      display: flex;
      align-items: stretch;
      gap: 15px;
      height: 400px;
    }
    .event-text {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .gifs-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 400px;
    }
    .gifs-column img {
      height: calc((400px - 12px) / 3);
      width: auto;
      object-fit: contain;
    }
    .main-photo {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    .event-row video {
      height: 100%;
      width: auto;
    }
    @media (max-width: 700px) {
      .event-row {
        flex-wrap: wrap;
        height: auto;
      }
      .event-text {
        width: 100%;
      }
      .gifs-column {
        flex-direction: row;
        height: auto;
        width: 100%;
      }
      .gifs-column img {
        height: auto;
        width: calc((100% - 12px) / 3);
      }
      .main-photo,
      .event-row video {
        height: auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="page-layout">
  <div class="content" id="content">
    <p class="page-title">arts and crafts</p>
    <p>artsy stuff i am working/worked on</p>
    <img class="deco" data-id="frog" src="./deco/frog.png" alt="" style="left:82%;top:71%;width:63px">
    <img class="deco" data-id="dog" src="./deco/dog.png" alt="" style="left:55%;top:74%;width:130px">
    <img class="deco" data-id="seal" src="./deco/seal.png" alt="" style="left:27%;top:40%;width:104px">
    <img class="deco" data-id="snailhare" src="./deco/snailhare.png" alt="" style="left:6%;top:40%;width:114px">
    <img class="deco" data-id="turtle" src="./deco/turtle.png" alt="" style="left:56%;top:5%;width:130px">
    <img class="deco" data-id="moth" src="./deco/moth.png" alt="" style="left:1%;top:67%;width:160px">
    <img class="deco" data-id="funnelman" src="./deco/funnelman.png" alt="" style="left:77%;top:6%;width:138px">
    <img class="deco" data-id="chairbird" src="./deco/chairbird.png" alt="" style="left:52%;top:38%;width:178px">
  </div>

  <div class="menu" id="menu"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">x</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const sections = {
    'digital-mixed-media': `
      <p class="page-title">digital-mixed-media</p>
      <br>
      <div class="gallery" id="gallery">
        <div class="gallery-item"><img src="./digital-mixed-media/teinik.png" alt="teinik"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/artemis.png" alt="artemis"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/astral.png" alt="astral"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/ballladies.png" alt="ballladies"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/blob.png" alt="blob"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/boyfriend.png" alt="boyfriend"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/horselady.png" alt="horselady"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/howmybfseesme.png" alt="howmybfseesme"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/icanseeyourface.png" alt="icanseeyourface"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/knightlady.png" alt="knightlady"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/pilote.gif" alt="pilote"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/prettylady.png" alt="prettylady"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/sakura.png" alt="sakura"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/spaceseal.png" alt="spaceseal"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/theboyandtheheroin.png" alt="theboyandtheheroin"></div>
        <div class="gallery-item"><img src="./digital-mixed-media/theyellowwallpaper.png" alt="theyellowwallpaper"></div>
      </div>
    `,
    'clay': `
      <p class="page-title">clay</p>
      <br>
      <div class="gallery" id="gallery">
      </div>
    `,
    'papercraft': `
      <p class="page-title">papercraft</p>
      <br>
      <div class="gallery" id="gallery">
        <div class="gallery-item"><img src="./papercraft/saber.jpg" alt="saber"></div>
      </div>
    `,
    '3d-model-painting': `
      <p class="page-title">3d-model-painting</p>
      <br>
      <div class="gallery" id="gallery">
        <div class="gallery-item"><img src="./3d-model-painting/r1.jpg" alt="r1"></div>
        <div class="gallery-item"><img src="./3d-model-painting/r2.jpg" alt="r2"></div>
        <div class="gallery-item"><img src="./3d-model-painting/r3.jpg" alt="r3"></div>
        <div class="gallery-item"><img src="./3d-model-painting/r4.jpg" alt="r4"></div>
      </div>
    `,
    'events-markets-exhibits': `
      <p class="page-title">events-markets-exhibits</p>
      <br>
      <div class="event-row">
        <div class="event-text">
          <p>nov 7, 2025</p>
          <p>took part in BYOB (bring your own beamer) organized by hosq.co. looking back at these drawings, i find them too depressing. i remember drawing them right after i moved out, when i was missing our old village house.</p>
        </div>
        <div class="gifs-column">
          <img src="./events-markets-exhibits/1.gif" alt="">
          <img src="./events-markets-exhibits/2.gif" alt="">
          <img src="./events-markets-exhibits/3.gif" alt="">
        </div>
        <img src="./events-markets-exhibits/ikindalookcoolhere.jpg" alt="" class="main-photo">
        <video src="./events-markets-exhibits/cringe.MOV" controls></video>
      </div>
      <br>
      <div class="event-row">
        <div class="event-text">
          <p>nov 22-23, 2025</p>
          <p>saw an invitation to take part in an exhibit-market in qrchi bazaar with the focus being more on making connections and exchanging items rather than selling them. it actually worked and i met some coolsy people there. one of them even gave me sun shaped red earrings that i wear religiously.</p>
        </div>
        <img src="./events-markets-exhibits/4.jpg" alt="" class="main-photo">
        <img src="./events-markets-exhibits/5.jpg" alt="" class="main-photo">
        <img src="./events-markets-exhibits/7.jpg" alt="" class="main-photo">
      </div>
    `,
  };

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  function showFromHash() {
    var key = location.hash.slice(1);
    if (sections[key]) show(key);
  }
  window.addEventListener('hashchange', showFromHash);
  showFromHash();

  function show(section) {
    document.getElementById('content').innerHTML = sections[section];
    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      });
    });
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

<script src="/nav.js"></script>
<script src="/deco.js"></script>
</body>
</html>
